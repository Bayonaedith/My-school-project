<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NK Upgrade Biometric Registration 2</title>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#0b1220,#1a2d4d);
font-family:'Segoe UI',sans-serif;
color:#0ff;
text-align:center;
padding:10px;
min-height:100vh;
}

h1{
font-size:1.2rem;
letter-spacing:2px;
margin:10px 0;
text-transform:uppercase;
color:#ffcc00;
}

.scanner-box{
position:relative;
width:160px;
height:160px;
border:2px solid #00f7ff;
border-radius:50%;
margin:auto;
overflow:hidden;
background:#000;
box-shadow:0 0 15px rgba(0,247,255,0.3);
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan-line{
position:absolute;
width:100%;
height:2px;
background:#00f7ff;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

.reg-container{
max-width:320px;
margin:auto;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
border:1px solid rgba(0,247,255,0.3);
}

input{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:8px;
background:#1a264d;
border:1px solid #00f7ff;
color:#fff;
border-radius:6px;
}

button{
width:100%;
padding:14px;
background:#00f7ff;
border:none;
border-radius:6px;
font-weight:bold;
margin-top:10px;
}

#status-msg{
margin-top:10px;
font-size:13px;
}

.success{color:#00ff9c;}
.error{color:#ff4444;}
</style>
</head>

<body>

<h1>NK Upgrade Biometric Registration 2</h1>

<div class="reg-container">

<div class="scanner-box">
<video id="video" autoplay muted playsinline></video>
<div class="scan-line"></div>
</div>

<input id="name" placeholder="Full Name">
<input id="country" placeholder="Country">
<input id="district" placeholder="District">
<input id="village" placeholder="Village">

<button id="regBtn">Register Face</button>

<div id="status-msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
authDomain:"my-school-project-6e00c.firebaseapp.com",
projectId:"my-school-project-6e00c",
storageBucket:"my-school-project-6e00c.appspot.com",
messagingSenderId:"14283853516",
appId:"1:14283853516:web:c7999ae32d83166cb8bc69"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const video=document.getElementById("video");
const regBtn=document.getElementById("regBtn");
const msg=document.getElementById("status-msg");

const DISTANCE_THRESHOLD=0.45;

let students=[];
let faceAlreadyRegistered=false;
let currentDescriptor=null;

function status(text,type=""){
msg.textContent=text;
msg.className=type;
}

async function startCamera(){

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user",width:480,height:480}
});

video.srcObject=stream;

}

async function loadModels(){

const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
]);

}

async function loadStudents(){

status("Loading database...");

const snapshot=await getDocs(collection(db,"students"));

snapshot.forEach(doc=>{

const data=doc.data();

if(data.faceDescriptor){

students.push({
name:data.name,
descriptor:new Float32Array(data.faceDescriptor)
});

}

});

status("Database Loaded");

}

function checkExistingFace(descriptor){

for(const student of students){

const distance=faceapi.euclideanDistance(descriptor,student.descriptor);

if(distance<DISTANCE_THRESHOLD){

return student.name;

}

}

return null;

}

async function autoScan(){

status("Scanning face...");

const detection=await faceapi
.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){
setTimeout(autoScan,1500);
return;
}

currentDescriptor=detection.descriptor;

const match=checkExistingFace(currentDescriptor);

if(match){

faceAlreadyRegistered=true;

status(match+" already registered → Redirecting","success");

setTimeout(()=>{
window.location.href="attendance.html";
},2000);

}else{

status("New face detected. Fill form to register","success");

}

}

regBtn.onclick=async()=>{

if(faceAlreadyRegistered){
status("Already registered","error");
return;
}

const name=document.getElementById("name").value.trim();
const country=document.getElementById("country").value.trim();
const district=document.getElementById("district").value.trim();
const village=document.getElementById("village").value.trim();

if(!name||!country||!district||!village){
status("Fill all fields","error");
return;
}

if(!currentDescriptor){
status("Face not detected","error");
return;
}

try{

await addDoc(collection(db,"students"),{
name,
country,
district,
village,
faceDescriptor:Array.from(currentDescriptor),
approved:false,
createdAt:serverTimestamp()
});

status("Registration successful","success");

students.push({
name,
descriptor:currentDescriptor
});

}catch(e){

status("Database error","error");

}

};

async function init(){

status("Loading AI...");

await loadModels();
await startCamera();
await loadStudents();

status("System Ready");

setTimeout(autoScan,2000);

}

init();

</script>

</body>
</html>
