<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biometric Registration</title>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:linear-gradient(135deg,#0b1220,#1a2d4d);
font-family:'Segoe UI',sans-serif;
color:#0ff;
text-align:center;
padding:10px;
min-height:100vh;
}

h1{
font-size:1.2rem;
letter-spacing:2px;
margin:10px 0;
text-transform:uppercase;
color:#ffcc00;
}

.scanner-box{
position:relative;
width:140px;
height:140px;
border:2px solid #00f7ff;
border-radius:50%;
margin:0 auto 15px;
background:#000;
overflow:hidden;
box-shadow:0 0 15px rgba(0,247,255,0.3);
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan-line{
position:absolute;
width:100%;
height:2px;
background:#00f7ff;
top:0;
animation:scan 2s linear infinite;
}

@keyframes scan{
from{top:0;}
to{top:100%;}
}

.reg-container{
max-width:320px;
margin:auto;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
border:1px solid rgba(0,247,255,0.3);
}

.form-group{
margin-bottom:10px;
text-align:left;
}

label{
font-size:0.65rem;
color:#888;
text-transform:uppercase;
margin-left:5px;
}

input{
width:100%;
padding:12px;
margin-top:4px;
background:#1a264d;
border:1px solid #00f7ff;
color:#fff;
border-radius:6px;
font-size:0.9rem;
outline:none;
}

input:focus{
border-color:#00ff9c;
box-shadow:0 0 10px rgba(0,255,156,0.3);
}

button{
width:100%;
padding:14px;
background:#00f7ff;
border:none;
border-radius:6px;
color:#0a0f2c;
font-weight:bold;
text-transform:uppercase;
letter-spacing:1px;
margin-top:10px;
font-size:0.9rem;
cursor:pointer;
}

button:disabled{
background:#444;
color:#888;
cursor:not-allowed;
}

#status-msg{
font-size:0.75rem;
margin-top:15px;
font-weight:bold;
}

.success{color:#00ff9c;}
.error{color:#ff4444;}

.back-link{
display:block;
margin-top:15px;
color:#888;
font-size:0.75rem;
text-decoration:none;
}
</style>
</head>

<body>

<h1>Biometric Enrollment</h1>

<div class="reg-container">

<div class="scanner-box">
<video id="video" autoplay muted playsinline></video>
<div class="scan-line"></div>
</div>

<div class="form-group">
<label>Student Full Name</label>
<input type="text" id="name" placeholder="Enter Full Name">
</div>

<div class="form-group">
<label>Country</label>
<input type="text" id="country" placeholder="Enter Country">
</div>

<div class="form-group">
<label>District</label>
<input type="text" id="district" placeholder="Enter District">
</div>

<div class="form-group">
<label>Village</label>
<input type="text" id="village" placeholder="Enter Village">
</div>

<button id="regBtn" disabled>Capture & Register</button>

<div id="status-msg"></div>

<a href="index.html" class="back-link">← Back to Scanner</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
authDomain:"my-school-project-6e00c.firebaseapp.com",
projectId:"my-school-project-6e00c",
storageBucket:"my-school-project-6e00c.appspot.com",
messagingSenderId:"14283853516",
appId:"1:14283853516:web:c7999ae32d83166cb8bc69"
};

const video=document.getElementById("video");
const regBtn=document.getElementById("regBtn");
const statusMsg=document.getElementById("status-msg");

let db;
let modelsLoaded=false;

function updateMsg(text,type=""){
statusMsg.textContent=text;
statusMsg.className=type;
}

async function startCamera(){
const stream=await navigator.mediaDevices.getUserMedia({
video:{
width:480,
height:480,
facingMode:"user"
}
});
video.srcObject=stream;

return new Promise(resolve=>{
video.onloadedmetadata=()=>{
video.play();
resolve();
};
});
}

async function loadModels(){

const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
]);

modelsLoaded=true;
}

async function init(){

try{

const app=initializeApp(firebaseConfig);
db=getFirestore(app);

updateMsg("Loading AI models...");

await loadModels();

updateMsg("Starting camera...");

await startCamera();

updateMsg("System ready for capture","success");

regBtn.disabled=false;

}catch(e){

console.error(e);
updateMsg("Camera or AI failed to load","error");

}

}

regBtn.addEventListener("click",async()=>{

const name=document.getElementById("name").value.trim();
const country=document.getElementById("country").value.trim();
const district=document.getElementById("district").value.trim();
const village=document.getElementById("village").value.trim();

if(!name||!country||!district||!village){
updateMsg("Please fill all fields","error");
return;
}

if(!modelsLoaded){
updateMsg("AI not ready","error");
return;
}

regBtn.disabled=true;
updateMsg("Scanning face...");

const detection=await faceapi
.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){

updateMsg("Face not detected. Look at camera.","error");
regBtn.disabled=false;
return;

}

try{

await addDoc(collection(db,"students"),{

name,
country,
district,
village,
faceDescriptor:Array.from(detection.descriptor),
approved:false,
createdAt:serverTimestamp()

});

updateMsg("Registration sent. Await admin approval.","success");

setTimeout(()=>{
window.location.href="index.html";
},3000);

}catch(e){

console.error(e);
updateMsg("Database error","error");
regBtn.disabled=false;

}

});

init();

</script>

</body>
</html>
