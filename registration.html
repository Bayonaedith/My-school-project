<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NK Upgrade Biometric System</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050a14;
            font-family: 'Courier New', monospace; /* Tech/Machine font */
            color: #0ff;
            text-align: center;
            padding: 10px;
            min-height: 100vh;
        }

        /* Tech Machine Header */
        .header { border-bottom: 1px solid #0ff; margin-bottom: 15px; padding-bottom: 5px; }
        .header h1 { font-size: 1rem; letter-spacing: 3px; }

        /* Scanning UI */
        .scanner-box {
            position: relative;
            width: 120px;
            height: 120px;
            border: 1px solid #0ff;
            margin: 0 auto 15px;
            background: #000;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(1.2) sepia(100%) hue-rotate(150deg); }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: #0ff;
            top: 0;
            animation: scan 1.5s linear infinite;
        }
        @keyframes scan { from { top: 0%; } to { top: 100%; } }

        /* Form & Terminal UI */
        .machine-container {
            max-width: 300px;
            margin: 0 auto;
            border: 1px solid #0ff;
            padding: 15px;
            background: rgba(0, 255, 255, 0.02);
            position: relative;
        }

        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { font-size: 0.6rem; letter-spacing: 1px; }

        input {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid #044;
            color: #0ff;
            font-size: 0.8rem;
            outline: none;
            margin-top: 2px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0ff;
            border: none;
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Pending Terminal State */
        #pending-ui { display: none; }
        .terminal-text {
            font-size: 0.7rem;
            text-align: left;
            height: 100px;
            overflow: hidden;
            color: #0f0;
            line-height: 1.4;
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>NK Upgrade Biometric System</h1>
    </div>

    <div class="machine-container" id="main-container">
        <div class="scanner-box">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-line"></div>
        </div>

        <div id="registration-fields">
            <div class="input-group">
                <label>> ID_NAME</label>
                <input type="text" id="name" placeholder="...">
            </div>
            <div class="input-group">
                <label>> GEO_COUNTRY</label>
                <input type="text" id="country" placeholder="...">
            </div>
            <div class="input-group">
                <label>> SEC_DISTRICT</label>
                <input type="text" id="district" placeholder="...">
            </div>
            <div class="input-group">
                <label>> LOC_VILLAGE</label>
                <input type="text" id="village" placeholder="...">
            </div>
            <button id="regBtn">Check & Register</button>
        </div>

        <div id="pending-ui">
            <div class="terminal-text" id="terminal">
                > INITIALIZING UPLOAD...<br>
                > ENCRYPTING DESCRIPTOR...<br>
                > DATA SENT TO CLOUD.<br>
                <span class="pulse">> AWAITING ADMIN AUTH...</span>
            </div>
            <div style="margin-top:20px;">
                <div class="pulse" style="font-size: 0.9rem; color: #ffcc00;">● STATUS: PENDING</div>
                <p style="font-size: 0.6rem; color: #888; margin-top: 10px;">DO NOT CLOSE THIS WINDOW</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const state = { db: null };
        const elements = {
            video: document.getElementById("video"),
            regBtn: document.getElementById("regBtn"),
            fields: document.getElementById("registration-fields"),
            pending: document.getElementById("pending-ui"),
            terminal: document.getElementById("terminal")
        };

        async function init() {
            const app = initializeApp(firebaseConfig);
            state.db = getFirestore(app);
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 240, height: 240, facingMode: 'user' } 
            });
            elements.video.srcObject = stream;
        }

        elements.regBtn.addEventListener('click', async () => {
            const data = {
                name: document.getElementById('name').value,
                country: document.getElementById('country').value,
                district: document.getElementById('district').value,
                village: document.getElementById('village').value
            };

            const det = await faceapi.detectSingleFace(elements.video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            
            if (det) {
                // 1. Submit to Firestore
                const docRef = await addDoc(collection(state.db, "students"), {
                    ...data,
                    faceDescriptor: Array.from(det.descriptor),
                    approved: false,
                    createdAt: serverTimestamp()
                });

                // 2. Switch to "Machine Pending" UI
                elements.fields.style.display = 'none';
                elements.pending.style.display = 'block';

                // 3. LISTEN for Admin Approval in Real-Time
                onSnapshot(doc(state.db, "students", docRef.id), (doc) => {
                    if (doc.data()?.approved === true) {
                        elements.terminal.innerHTML += "<br>> AUTH GRANTED.";
                        elements.terminal.innerHTML += "<br>> REDIRECTING...";
                        
                        setTimeout(() => {
                            sessionStorage.setItem('studentData', JSON.stringify(doc.data()));
                            window.location.href = 'attendance.html';
                        }, 1500);
                    }
                });
            }
        });

        init();
    </script>
</body>
</html>
