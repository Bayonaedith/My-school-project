<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Lyric Generator</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

#lyrics{
font-size:32px;
margin-top:50px;
color:#00ffcc;
}

button{
padding:12px 25px;
margin-top:20px;
font-size:18px;
background:#00ffcc;
border:none;
cursor:pointer;
}

audio{
margin-top:20px;
}

</style>

</head>

<body>

<h1>🎵 AI Lyric Generator</h1>

<input type="file" id="audioUpload" accept="audio/*">

<br>

<audio id="audio" controls></audio>

<br>

<button onclick="startRecognition()">Generate Lyrics</button>

<div id="lyrics">Lyrics will appear here...</div>

<script>

const audioUpload = document.getElementById("audioUpload");
const audio = document.getElementById("audio");
const lyrics = document.getElementById("lyrics");

audioUpload.onchange = function(){
const file = this.files[0];
audio.src = URL.createObjectURL(file);
}

function startRecognition(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = true;

recognition.onresult = function(event){

let transcript = "";

for(let i = event.resultIndex; i < event.results.length; i++){

transcript += event.results[i][0].transcript;

}

lyrics.innerText = transcript;

};

recognition.start();

audio.play();

}

</script>

</body>
</html>
