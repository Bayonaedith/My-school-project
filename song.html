<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Lyric Video - Fixed Permissions</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .wrapper { max-width: 900px; margin: auto; }
        
        canvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            margin-top: 20px;
        }

        .upload-zone {
            padding: 30px;
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
        }

        button {
            padding: 15px 40px;
            background: #00ffcc;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 15px;
        }

        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        #status { color: #ffcc00; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="upload-zone">
            <h1>🎬 Instant Lyric Video</h1>
            <p>1. Select Music File -> 2. Click Start</p>
            <input type="file" id="audioUpload" accept="audio/*">
            <br>
            <button id="startBtn">Start AI & Play</button>
            <div id="status">Waiting for file...</div>
        </div>

        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audioPlayer");
        const status = document.getElementById("status");
        const startBtn = document.getElementById("startBtn");
        const fileInput = document.getElementById("audioUpload");
        
        let liveLyrics = "READY TO START";

        // Render Loop
        function render() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(liveLyrics.toUpperCase(), canvas.width / 2, canvas.height / 2);

            if (audio.duration) {
                const pct = audio.currentTime / audio.duration;
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#1a1a1a";
                ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(0, canvas.height - 15, canvas.width * pct, 15);
            }
            requestAnimationFrame(render);
        }
        render();

        fileInput.onchange = () => { status.innerText = "File loaded. Click Start!"; };

        startBtn.onclick = function() {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first!");

            audio.src = URL.createObjectURL(file);
            status.innerText = "Checking Microphone Permissions...";

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Browser not supported!");

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                status.innerText = "🎤 AI ACTIVE - PLAYING SONG";
                liveLyrics = "Listening...";
                audio.play();
                startBtn.disabled = true;
            };

            recognition.onresult = (event) => {
                let currentText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentText = event.results[i][0].transcript;
                }
                liveLyrics = currentText;
            };

            recognition.onerror = (e) => {
                status.innerText = "PERMISSION ERROR: " + e.error;
                console.error(e);
            };

            // Requesting microphone access
            recognition.start();
        };
    </script>
</body>
</html>
