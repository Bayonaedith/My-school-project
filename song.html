<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Sync Lyric Video</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .wrapper { max-width: 900px; margin: auto; }
        
        canvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            margin-top: 20px;
        }

        .upload-zone {
            padding: 40px;
            background: #111;
            border: 2px dashed #333;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        #status { color: #00ffcc; font-weight: bold; margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="upload-zone" id="dropZone">
            <h1>🎬 Instant Lyric Video</h1>
            <p>Upload your MP3/WAV file below</p>
            <input type="file" id="audioUpload" accept="audio/*">
            <div id="status">IDLE - Waiting for File</div>
        </div>

        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audioPlayer");
        const status = document.getElementById("status");
        const fileInput = document.getElementById("audioUpload");
        
        let liveLyrics = "LYRICS WILL APPEAR HERE";

        // 1. Smooth Animation Loop
        function render() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Text Styles
            ctx.shadowBlur = 20;
            ctx.shadowColor = "rgba(0, 255, 204, 0.5)";
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 55px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Draw Lyrics
            ctx.fillText(liveLyrics.toUpperCase(), canvas.width / 2, canvas.height / 2);

            // Progress Bar
            if (audio.duration) {
                const pct = audio.currentTime / audio.duration;
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#1a1a1a";
                ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(0, canvas.height - 10, canvas.width * pct, 10);
            }

            requestAnimationFrame(render);
        }
        render();

        // 2. The Logic to Remove Delays
        fileInput.onchange = function() {
            const file = this.files[0];
            if (!file) return;

            status.innerText = "⚡ BOOTING AI ENGINE...";
            audio.src = URL.createObjectURL(file);

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            // When the AI is actually ready to listen
            recognition.onstart = () => {
                status.innerText = "🎤 RECORDING LIVE...";
                liveLyrics = "Listening...";
                audio.play().catch(() => {
                    status.innerText = "⚠️ CLICK SCREEN TO ENABLE AUDIO";
                });
            };

            recognition.onresult = (event) => {
                let currentText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentText = event.results[i][0].transcript;
                }
                liveLyrics = currentText;
            };

            recognition.onerror = (e) => {
                status.innerText = "ERROR: " + e.error;
            };

            // Start recognition first, then the song
            recognition.start();
        };
    </script>
</body>
</html>
