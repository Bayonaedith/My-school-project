<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant AI Lyric Video with Progress</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .wrapper { max-width: 800px; margin: 40px auto; }
        
        canvas {
            width: 100%;
            background: #000;
            border: 3px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        .controls { margin: 20px 0; padding: 20px; background: #1a1a1a; border-radius: 10px; }
        button { 
            padding: 15px 30px; background: #00ffcc; border: none; 
            font-weight: bold; cursor: pointer; border-radius: 5px;
            transition: 0.2s;
        }
        button:hover { background: #00d4aa; transform: scale(1.05); }
        #status { color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>🎙️ Real-Time Lyric Video</h1>
        
        <div class="controls">
            <input type="file" id="audioUpload" accept="audio/*">
            <br><br>
            <button id="startBtn" onclick="startGeneration()">Start Generating</button>
            <div id="status">Upload a file and hit Start</div>
        </div>

        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audioPlayer");
        const status = document.getElementById("status");
        
        let liveLyrics = "Waiting for audio...";

        function render() {
            // 1. Clear Screen
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Lyrics
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            ctx.font = "italic bold 60px Arial";
            ctx.textAlign = "center";
            ctx.fillText(liveLyrics, canvas.width / 2, canvas.height / 2);

            // 3. --- NEW: DRAW PROGRESS BAR ---
            if (audio.duration) {
                const progress = audio.currentTime / audio.duration;
                const barHeight = 15;
                const barWidth = canvas.width * progress;

                // Background track (dark grey)
                ctx.shadowBlur = 0; // Turn off glow for the bar
                ctx.fillStyle = "#333";
                ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

                // Active progress (bright cyan)
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(0, canvas.height - barHeight, barWidth, barHeight);
            }

            requestAnimationFrame(render);
        }

        render();

        async function startGeneration() {
            const file = document.getElementById("audioUpload").files[0];
            if (!file) return alert("Please select a music file first!");

            audio.src = URL.createObjectURL(file);
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                status.innerText = "Recording & Playing...";
                audio.play();
            };

            recognition.onresult = (event) => {
                let currentBatch = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentBatch = event.results[i][0].transcript;
                }
                liveLyrics = currentBatch;
            };

            recognition.start();
        }
    </script>
</body>
</html>
