<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Audio to Video Generator</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 15px; }
        
        /* This is where the "Video" is drawn */
        canvas {
            width: 100%;
            max-width: 400px;
            background: #111;
            border: 2px solid #00ffcc;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            padding: 15px 30px;
            background: #00ffcc;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        #status { color: #ffcc00; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📹 Audio to Lyric Video</h1>
        <input type="file" id="audioUpload" accept="audio/*">
        <br>
        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <br>
        <button id="recordBtn" onclick="processVideo()">Upload & Generate Video</button>
        <div id="status">Waiting for upload...</div>
        <audio id="audioSource"></audio>
    </div>

    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audioSource");
        const status = document.getElementById("status");
        let currentText = "Waiting to start...";

        // 1. Draw the initial frame
        function drawFrame(text) {
            // Background
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Text Settings
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 50px Arial";
            ctx.textAlign = "center";
            
            // Wrap text if too long
            ctx.fillText(text, canvas.width/2, canvas.height/2);
        }
        drawFrame(currentText);

        async function processVideo() {
            const file = document.getElementById("audioUpload").files[0];
            if (!file) return alert("Please upload an audio file first!");

            audio.src = URL.createObjectURL(file);
            status.innerText = "Initializing AI Voice Capture...";

            // Setup Speech Recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            // Setup Recording
            const canvasStream = canvas.captureStream(30); // 30 FPS
            const mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            let chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                
                // Provide download link
                const a = document.createElement("a");
                a.href = videoURL;
                a.download = "lyric-video.webm";
                a.innerText = "⬇️ Download Your Video";
                a.style.display = "block";
                a.style.color = "#00ffcc";
                document.body.appendChild(a);
                status.innerText = "Video Ready!";
            };

            recognition.onresult = (event) => {
                let result = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    result = event.results[i][0].transcript;
                }
                currentText = result;
            };

            // Animation Loop to keep the canvas updating
            function updateCanvas() {
                drawFrame(currentText);
                if (!audio.ended) requestAnimationFrame(updateCanvas);
            }

            // Start everything
            recognition.start();
            audio.play();
            mediaRecorder.start();
            updateCanvas();
            status.innerText = "Recording Video... Speak/Play Audio now!";

            audio.onended = () => {
                mediaRecorder.stop();
                recognition.stop();
            };
        }
    </script>
</body>
</html>
