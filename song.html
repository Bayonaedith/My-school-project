<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant AI Lyric Video</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .wrapper { max-width: 800px; margin: 40px auto; }
        
        canvas {
            width: 100%;
            background: #000;
            border: 3px solid #00ffcc;
            border-radius: 10px;
        }

        .controls { margin: 20px 0; padding: 30px; background: #1a1a1a; border-radius: 10px; border: 1px solid #333; }
        
        /* Styled Upload Button */
        input[type="file"] {
            background: #222;
            padding: 10px;
            border-radius: 5px;
            color: #00ffcc;
            cursor: pointer;
        }

        #status { color: #00ffcc; margin-top: 15px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>🎙️ Auto-Lyric Video Generator</h1>
        
        <div class="controls">
            <p>Select a song to start automatically:</p>
            <input type="file" id="audioUpload" accept="audio/*">
            <div id="status">Ready for upload...</div>
        </div>

        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const audio = document.getElementById("audioPlayer");
        const status = document.getElementById("status");
        const fileInput = document.getElementById("audioUpload");
        
        let liveLyrics = "Upload a song to begin...";

        // 1. THE RENDERING LOOP (Always running)
        function render() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Lyrics
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
            ctx.fillStyle = "#00ffcc";
            ctx.font = "italic bold 60px Arial";
            ctx.textAlign = "center";
            ctx.fillText(liveLyrics, canvas.width / 2, canvas.height / 2);

            // Draw Progress Bar
            if (audio.duration) {
                const progress = audio.currentTime / audio.duration;
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#333";
                ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(0, canvas.height - 20, canvas.width * progress, 20);
            }

            requestAnimationFrame(render);
        }
        render();

        // 2. THE AUTO-START TRIGGER
        fileInput.onchange = function() {
            const file = this.files[0];
            if (!file) return;

            // Load the audio
            audio.src = URL.createObjectURL(file);
            status.innerText = "🎤 AI is listening...";
            liveLyrics = "Initializing...";

            // Start Speech Recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                status.innerText = "Error: Browser not supported.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                audio.play().catch(err => {
                    status.innerText = "Click anywhere on the page to enable audio!";
                });
            };

            recognition.onresult = (event) => {
                let currentBatch = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentBatch = event.results[i][0].transcript;
                }
                liveLyrics = currentBatch;
            };

            recognition.start();
        };
    </script>
</body>
</html>
