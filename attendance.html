<!DOCTYPE html>
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>NK Biometric Attendance</title>  

    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>  

    <style>  
        body {  
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;  
            background: #0a0f2c;  
            color: #00f7ff;  
            text-align: center;  
            padding: 20px;  
            overflow-x: hidden;  
        }  

        h2 { font-size: 2rem; color: #00f7ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f7ff; }  

        .video-wrapper { 
            position: relative; 
            display: inline-block; 
            width: 400px; 
            height: 300px; 
            border: 3px solid #00f7ff; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,247,255,0.3);
        }  

        video { width: 100%; height: 100%; object-fit: cover; background: #000; }  

        /* Scanning Animation Overlay */  
        #scannerOverlay {  
            position: absolute;  
            width: 100%;  
            height: 100%;  
            top: 0; left: 0;  
            pointer-events: none;  
            border: 1px solid rgba(0,247,255,0.2);  
        }  

        #scannerLine {  
            position: absolute;  
            width: 100%;  
            height: 3px;  
            background: linear-gradient(to bottom, transparent, #00f7ff, transparent);  
            box-shadow: 0 0 15px #00f7ff;
            animation: scan 2.5s ease-in-out infinite;  
        }  

        @keyframes scan {  
            0% { top: 0%; }  
            50% { top: 100%; }
            100% { top: 0%; }  
        }  

        .progress-container {  
            width: 400px; height: 8px; background: #1a264d; margin: 15px auto;  
            border-radius: 10px; overflow: hidden; display: none;  
        }  
        #progressBar { width: 0%; height: 100%; background: #00f7ff; transition: width 0.1s linear; }  

        #profileCard {  
            max-width: 400px; margin: 20px auto; padding: 20px;  
            background: rgba(0, 247, 255, 0.1); border: 2px solid #00f7ff;  
            border-radius: 12px; display: none;  
            box-shadow: 0 0 20px rgba(0,247,255,0.5);  
            animation: glow 1.5s infinite alternate;  
        }  

        @keyframes glow {  
            0% { transform: scale(1); box-shadow: 0 0 10px #00f7ff; }  
            100% { transform: scale(1.02); box-shadow: 0 0 25px #00f7ff; }  
        }  

        .info-label { color: #88fbff; font-size: 0.75rem; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }  
        .info-value { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }  

        #status { margin-top: 15px; font-size: 1.1rem; color: #00f7ff; font-weight: 500; }  
        #debugInfo { margin-top: 5px; font-size: 0.85rem; color: #ffaa00; font-family: monospace; }  

        .log-container {  
            margin-top: 30px; background: rgba(255,255,255,0.05); padding: 20px;  
            border-radius: 12px; display: inline-block; min-width: 380px; text-align: left;  
            border: 1px solid rgba(0,247,255,0.2);
        }  
        .log-container h3 { margin-top: 0; color: #00f7ff; font-size: 1rem; border-bottom: 1px solid #1a264d; padding-bottom: 10px; }
        #attendanceList li { padding: 8px 0; border-bottom: 1px solid #1a264d; font-size: 0.9rem; }
    </style>  
</head>  

<body>  
    <h2>⏱️ NK Biometric Attendance</h2>  

    <div class="video-wrapper">  
        <video id="video" autoplay muted playsinline></video>  
        <div id="scannerOverlay"><div id="scannerLine"></div></div>  
    </div>  

    <div class="progress-container" id="progressWrap">  
        <div id="progressBar"></div>  
    </div>  

    <p id="status">System Initializing...</p>  
    <p id="debugInfo">Awaiting input...</p>  

    <div id="profileCard">  
        <div class="info-label">Student Name</div>  
        <div id="resName" class="info-value">-</div>  
        <div class="info-label">Location Data</div>  
        <div id="resLocation" class="info-value">-</div>  
        <div id="resStatus" style="margin-top: 15px; font-weight: bold; color: #00ff88;">-</div>  
    </div>  

    <div class="log-container">  
        <h3>RECENT ATTENDANCE LOGS</h3>  
        <ul id="attendanceList" style="list-style: none; padding: 0;"></ul>  
    </div>  

<script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";  
    import { getFirestore, collection, getDocs, addDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  

    const firebaseConfig = {  
        apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",  
        authDomain: "my-school-project-6e00c.firebaseapp.com",  
        projectId: "my-school-project-6e00c",  
        storageBucket: "my-school-project-6e00c.appspot.com",  
        messagingSenderId: "14283853516",  
        appId: "1:14283853516:web:c7999ae32d83166cb8bc69"  
    };  

    // Initialization
    const app = initializeApp(firebaseConfig);  
    const db = getFirestore(app);  

    const video = document.getElementById("video");  
    const status = document.getElementById("status");  
    const debugInfo = document.getElementById("debugInfo");  
    const list = document.getElementById("attendanceList");  
    const profileCard = document.getElementById("profileCard");  
    const progressBar = document.getElementById("progressBar");  
    const progressWrap = document.getElementById("progressWrap");  

    let faceMatcher = null;  
    let allStudentsData = [];  
    let isProcessing = false;  
    let consecutiveMatches = 0;
    let lastMatchName = null;

    const DISTANCE_THRESHOLD = 0.45; // Strictly recognize faces
    const MATCHES_REQUIRED = 3; // Number of frames to confirm identity
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();  

    function playSound(type) {  
        const osc = audioCtx.createOscillator();  
        const gain = audioCtx.createGain();  
        if (type === 'success') {  
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);  
        } else {  
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);  
        }  
        osc.connect(gain); gain.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);  
    }  

    async function init() {  
        try {
            status.innerText = "Loading AI Neural Networks...";
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';  
            
            await Promise.all([  
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),  
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),  
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)  
            ]);  
            
            await loadStudents();  
            await startCamera();  
            startRecognitionLoop();
        } catch (e) {
            status.innerText = "Error: Check Console or Camera Permissions";
            console.error(e);
        }
    }  

    async function loadStudents() {  
        status.innerText = "Syncing Student Database...";  
        const q = query(collection(db, "students"));  
        const querySnapshot = await getDocs(q);  
        const labeledDescriptors = [];  

        querySnapshot.forEach(doc => {  
            const data = doc.data();  
            allStudentsData.push(data);  
            if (data.faceDescriptor) {  
                // Ensure descriptor is formatted as Float32Array
                const desc = new Float32Array(Object.values(data.faceDescriptor));
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.name, [desc]));  
            }  
        });  

        if (labeledDescriptors.length > 0) {  
            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, DISTANCE_THRESHOLD);  
            status.innerText = "Scanner Active. Please look at camera.";  
        } else {
            status.innerText = "Database Empty: No students found.";
        }
    }  

    async function startCamera() {  
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });  
        video.srcObject = stream;  
    }  

    function startRecognitionLoop() {  
        setInterval(async () => {  
            if (!faceMatcher || isProcessing || video.paused) return;  

            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();  

            if (detection) {  
                const bestMatch = faceMatcher.findBestMatch(detection.descriptor);  
                debugInfo.innerText = `ID: ${bestMatch.label} | Dist: ${bestMatch.distance.toFixed(3)}`;

                if (bestMatch.label !== 'unknown') {  
                    if (lastMatchName === bestMatch.label) {
                        consecutiveMatches++;
                    } else {
                        consecutiveMatches = 1;
                        lastMatchName = bestMatch.label;
                    }

                    if (consecutiveMatches >= MATCHES_REQUIRED) {  
                        const studentInfo = allStudentsData.find(s => s.name === bestMatch.label);  
                        if (studentInfo) {
                            handleMatch(studentInfo);
                            consecutiveMatches = 0;
                        }
                    }  
                } else {  
                    consecutiveMatches = 0;
                    lastMatchName = null;
                }  
            } else {
                debugInfo.innerText = "No face detected in frame.";
            }
        }, 600);  
    }  

    async function handleMatch(info) {  
        isProcessing = true;  
        playSound('success');  
        
        document.getElementById("resName").innerText = info.name;  
        document.getElementById("resLocation").innerText = `${info.district || 'Main Campus'} / ${info.village || 'N/A'}`;  
        document.getElementById("resStatus").innerText = "✅ ATTENDANCE LOGGED";  
        
        profileCard.style.display = "block";  
        status.innerText = "Identity Confirmed.";
        
        await markAttendance(info);  

        progressWrap.style.display = "block";  
        let timeLeft = 0;  
        const duration = 3500;
        const timer = setInterval(() => {  
            timeLeft += 100;  
            progressBar.style.width = (timeLeft / duration) * 100 + "%";  
            if (timeLeft >= duration) { 
                clearInterval(timer); 
                resetScanner(); 
            }  
        }, 100);  
    }  

    function resetScanner() {  
        isProcessing = false;  
        progressWrap.style.display = "none";  
        progressBar.style.width = "0%";  
        profileCard.style.display = "none";  
        status.innerText = "Ready for next student...";  
    }  

    async function markAttendance(info) {  
        try {  
            await addDoc(collection(db, "attendance"), { 
                studentName: info.name, 
                district: info.district || "Default", 
                time: serverTimestamp() 
            });  
            
            const li = document.createElement("li");  
            li.innerHTML = `✅ <strong>${info.name}</strong> - ${new Date().toLocaleTimeString()}`;  
            list.prepend(li);  
            if (list.children.length > 5) list.lastChild.remove();  
        } catch (e) { console.error("Firebase write error:", e); }  
    }  

    // Run the app
    init();  
</script>  
</body>  
</html>
