<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System - Live Scan</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f2c; color: white; text-align: center; padding: 20px; margin: 0; }
        
        h2 { color: #00f7ff; margin-bottom: 10px; }
        
        video { 
            border: 3px solid #00f7ff; 
            border-radius: 10px; 
            width: 100%; 
            max-width: 500px; 
            background: #000; 
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.3); 
        }
        
        /* Loading/Cooldown Bar */
        .progress-container { 
            width: 100%; 
            max-width: 500px; 
            height: 10px; 
            background: #1a264d; 
            margin: 15px auto; 
            border-radius: 5px; 
            overflow: hidden; 
            display: none; 
        }
        #progressBar { width: 0%; height: 100%; background: #00f7ff; transition: width 0.1s linear; }

        /* Profile Result Card */
        #profileCard { 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            background: rgba(0, 247, 255, 0.1); 
            border: 2px solid #00f7ff; 
            border-radius: 12px; 
            display: none;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .info-label { color: #00f7ff; font-size: 0.75rem; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }
        .info-value { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }

        #status { margin-top: 15px; font-size: 1.1rem; color: #00f7ff; min-height: 1.5em; font-weight: 500; }
        
        .log-container { 
            margin-top: 20px; 
            background: rgba(255,255,255,0.05); 
            padding: 15px; 
            border-radius: 10px; 
            display: inline-block; 
            min-width: 350px; 
            border: 1px solid #333;
        }
        #attendanceList li { 
            padding: 8px; 
            border-bottom: 1px solid #333; 
            font-size: 0.9rem; 
        }
    </style>
</head>
<body>

    <h2>⏱️ Student Attendance Scan</h2>
    
    <video id="video" autoplay muted playsinline></video>
    
    <div class="progress-container" id="progressWrap">
        <div id="progressBar"></div>
    </div>

    <p id="status">Initializing AI Models...</p>

    <div id="profileCard">
        <div class="info-label">Student Name</div>
        <div id="resName" class="info-value">-</div>
        
        <div class="info-label">Location Details</div>
        <div id="resLocation" class="info-value">-</div>
        
        <div id="resStatus" style="color: #00ff88; margin-top: 15px; font-weight: bold; font-size: 1.1rem;">✅ Attendance Marked</div>
    </div>

    <div class="log-container">
        <h3>Recent Logs:</h3>
        <ul id="attendanceList" style="list-style: none; padding: 0; text-align: left;"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const list = document.getElementById("attendanceList");
        const profileCard = document.getElementById("profileCard");
        const progressBar = document.getElementById("progressBar");
        const progressWrap = document.getElementById("progressWrap");

        let faceMatcher = null;
        let allStudentsData = [];
        let isProcessing = false;

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSuccessSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playErrorSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- INITIALIZATION ---
        async function init() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            try {
                status.innerText = "Loading AI Intelligence...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                await loadStudents();
                startCamera();
            } catch (err) { status.innerText = "Error: " + err.message; }
        }

        async function loadStudents() {
            status.innerText = "Fetching approved student list...";
            const q = query(collection(db, "students"), where("approved", "==", true));
            const querySnapshot = await getDocs(q);
            const labeledDescriptors = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                allStudentsData.push(data);
                const desc = new Float32Array(data.faceDescriptor);
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.name, [desc]));
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
                status.innerText = "Scanner Ready. Please look at the camera.";
                startRecognitionLoop();
            } else {
                status.innerText = "Database is empty or no students approved.";
            }
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            video.srcObject = stream;
        }

        // --- CORE RECOGNITION LOOP ---
        async function startRecognitionLoop() {
            setInterval(async () => {
                if (!faceMatcher || isProcessing) return;

                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (detection) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (bestMatch.label !== 'unknown') {
                        const studentInfo = allStudentsData.find(s => s.name === bestMatch.label);
                        handleMatch(studentInfo);
                    } else {
                        // UNRECOGNIZED FACE - REDIRECT
                        isProcessing = true;
                        status.innerText = "❌ Face Not Recognized. Redirecting to Register...";
                        playErrorSound();
                        
                        setTimeout(() => {
                            window.location.href = "face.html";
                        }, 2500); 
                    }
                }
            }, 1000); 
        }

        // --- HANDLING SUCCESSFUL MATCH ---
        async function handleMatch(info) {
            isProcessing = true; 
            playSuccessSound();

            document.getElementById("resName").innerText = info.name;
            document.getElementById("resLocation").innerText = `${info.country} / ${info.district} / ${info.village}`;
            profileCard.style.display = "block";
            status.innerText = "✅ Attendance Logged!";

            await markAttendance(info);

            // Cooldown animation (4 seconds)
            progressWrap.style.display = "block";
            let timeLeft = 0;
            const duration = 4000; 
            const interval = 100; 
            
            const timer = setInterval(() => {
                timeLeft += interval;
                const percent = (timeLeft / duration) * 100;
                progressBar.style.width = percent + "%";

                if (timeLeft >= duration) {
                    clearInterval(timer);
                    resetScanner();
                }
            }, interval);
        }

        function resetScanner() {
            isProcessing = false; 
            progressWrap.style.display = "none";
            progressBar.style.width = "0%";
            profileCard.style.display = "none";
            status.innerText = "Ready for next student...";
        }

        async function markAttendance(info) {
            try {
                await addDoc(collection(db, "attendance"), {
                    studentName: info.name,
                    district: info.district,
                    time: serverTimestamp()
                });
                
                const li = document.createElement("li");
                li.innerHTML = `✅ <strong>${info.name}</strong> - ${new Date().toLocaleTimeString()}`;
                if (list.children.length > 5) list.lastChild.remove();
                list.prepend(li);
            } catch (e) { console.error("Database Error:", e); }
        }

        init();
    </script>
</body>
</html>
