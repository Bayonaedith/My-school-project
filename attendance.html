<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Student Scanner</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f2c; color: white; text-align: center; padding: 20px; }
        video { border: 3px solid #00f7ff; border-radius: 10px; width: 100%; max-width: 450px; background: #000; }
        .progress-container { width: 100%; max-width: 450px; height: 8px; background: #1a264d; margin: 15px auto; border-radius: 5px; display: none; overflow: hidden; }
        #progressBar { width: 0%; height: 100%; background: #00f7ff; }
        #status { margin-top: 15px; font-size: 1.2rem; color: #00f7ff; font-weight: bold; }
        #profileCard { max-width: 400px; margin: 20px auto; padding: 20px; background: rgba(0, 247, 255, 0.1); border: 2px solid #00f7ff; border-radius: 12px; display: none; }
    </style>
</head>
<body>

    <h2>⏱️ Student Attendance Scan</h2>
    <video id="video" autoplay muted playsinline></video>
    
    <div class="progress-container" id="progressWrap"><div id="progressBar"></div></div>
    <p id="status">Warming up AI...</p>

    <div id="profileCard">
        <h3 id="resName">-</h3>
        <p id="resLocation">-</p>
        <div style="color: #00ff88;">✅ Confirmed</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const video = document.getElementById("video");
        const status = document.getElementById("status");
        
        let faceMatcher = null;
        let allStudentsData = [];
        let isProcessing = false;

        // Audio Setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type === 'success' ? 'sine' : 'sawtooth';
            osc.frequency.setValueAtTime(type === 'success' ? 880 : 120, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        async function init() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            
            // Load Students
            const q = query(collection(db, "students"), where("approved", "==", true));
            const snap = await getDocs(q);
            const labeled = [];
            snap.forEach(doc => {
                const d = doc.data();
                allStudentsData.push(d);
                labeled.push(new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.faceDescriptor)]));
            });

            if (labeled.length > 0) {
                // IMPORTANT: 0.45 is STRICTER than 0.6. This forces better differentiation.
                faceMatcher = new faceapi.FaceMatcher(labeled, 0.45);
                status.innerText = "Ready. Scan your face.";
                startCamera();
            } else {
                status.innerText = "No approved students in database.";
            }
        }

        async function startCamera() {
            video.srcObject = await navigator.mediaDevices.getUserMedia({ video: {} });
            scan();
        }

        async function scan() {
            if (isProcessing) { setTimeout(scan, 500); return; }

            const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

            if (det) {
                const match = faceMatcher.findBestMatch(det.descriptor);
                
                if (match.label !== 'unknown') {
                    const info = allStudentsData.find(s => s.name === match.label);
                    handleSuccess(info);
                } else {
                    // UNRECOGNIZED -> REDIRECT
                    isProcessing = true;
                    status.innerText = "❌ Unknown Face! Redirecting...";
                    playSound('error');
                    setTimeout(() => window.location.href = "face.html", 2000);
                    return; // Stop the loop
                }
            }
            setTimeout(scan, 800);
        }

        async function handleSuccess(info) {
            isProcessing = true;
            playSound('success');
            document.getElementById("resName").innerText = info.name;
            document.getElementById("resLocation").innerText = info.district;
            document.getElementById("profileCard").style.display = "block";
            status.innerText = "✅ Logged!";

            await addDoc(collection(db, "attendance"), { studentName: info.name, district: info.district, time: serverTimestamp() });

            // Cooldown
            const wrap = document.getElementById("progressWrap");
            const bar = document.getElementById("progressBar");
            wrap.style.display = "block";
            let p = 0;
            const iv = setInterval(() => {
                p += 5;
                bar.style.width = p + "%";
                if (p >= 100) {
                    clearInterval(iv);
                    wrap.style.display = "none";
                    bar.style.width = "0%";
                    document.getElementById("profileCard").style.display = "none";
                    isProcessing = false;
                    status.innerText = "Ready...";
                }
            }, 150);
        }

        init();
    </script>
</body>
</html>
