<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NK Biometric Attendance</title>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #0a0f2c;
    color: #00f7ff;
    text-align: center;
    padding: 20px;
}

.video-wrapper {
    position: relative;
    display: inline-block;
    width: 400px;
    height: 300px;
}

video {
    width: 100%;
    height: 100%;
    border: 3px solid #00f7ff;
    border-radius: 12px;
    background: #000;
}

#scannerOverlay {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border: 2px solid rgba(0,247,255,0.5);
}

#scannerLine {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #00f7ff;
    animation: scan 2s linear infinite;
}

@keyframes scan {
    0% { top: 0%; }
    100% { top: 100%; }
}

#profileCard {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border: 2px solid #00f7ff;
    border-radius: 10px;
}

.progress-container {
    width: 400px;
    height: 10px;
    background: #1a264d;
    margin: 10px auto;
    display: none;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #00f7ff;
}
</style>
</head>

<body>

<h2>⏱️ NK Biometric Attendance</h2>

<div class="video-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <div id="scannerOverlay"><div id="scannerLine"></div></div>
</div>

<div class="progress-container" id="progressWrap">
    <div id="progressBar"></div>
</div>

<p id="status">Initializing system...</p>
<p id="debugInfo"></p>

<div id="profileCard">
    <p><b>Name:</b> <span id="resName"></span></p>
    <p><b>Location:</b> <span id="resLocation"></span></p>
    <p id="resStatus"></p>
</div>

<ul id="attendanceList"></ul>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ✅ YOUR REAL FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
    authDomain: "my-school-project-6e00c.firebaseapp.com",
    projectId: "my-school-project-6e00c",
    storageBucket: "my-school-project-6e00c.appspot.com",
    messagingSenderId: "14283853516",
    appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const video = document.getElementById("video");
const status = document.getElementById("status");
const debugInfo = document.getElementById("debugInfo");
const list = document.getElementById("attendanceList");

let faceMatcher;
let students = [];

const DISTANCE_THRESHOLD = 0.5;
const REQUIRED_MATCHES = 3;

let lastMatch = null;
let matchCount = 0;
let busy = false;

// 🔊 SOUND
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(ok){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = ok ? 800 : 200;
    gain.gain.value = 0.1;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

// 📷 CAMERA
async function startCamera(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
    } catch {
        status.innerText = "❌ Camera access denied!";
    }
}

// 🤖 LOAD AI MODELS
async function loadModels(){
    const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
    await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(URL);
}

// 👨‍🎓 LOAD STUDENTS
async function loadStudents(){
    const snap = await getDocs(query(collection(db,"students")));
    const labeled = [];

    snap.forEach(doc=>{
        const d = doc.data();
        students.push(d);

        if(d.faceDescriptor){
            labeled.push(
                new faceapi.LabeledFaceDescriptors(
                    d.name,
                    [new Float32Array(d.faceDescriptor)]
                )
            );
        }
    });

    faceMatcher = new faceapi.FaceMatcher(labeled, DISTANCE_THRESHOLD);
}

// 🔍 SCAN LOOP
function startScan(){
    setInterval(async ()=>{
        if(!faceMatcher || busy) return;

        const result = await faceapi
            .detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceDescriptor();

        if(result){
            const best = faceMatcher.findBestMatch(result.descriptor);
            const dist = best.distance;

            debugInfo.innerText = "Distance: " + dist.toFixed(2);

            if(best.label !== "unknown" && dist < DISTANCE_THRESHOLD){

                if(lastMatch === best.label){
                    matchCount++;
                } else {
                    lastMatch = best.label;
                    matchCount = 1;
                }

                if(matchCount >= REQUIRED_MATCHES){
                    const student = students.find(s=>s.name === best.label);
                    if(student){
                        process(student);
                    }
                    matchCount = 0;
                }

            } else {
                matchCount = 0;
                lastMatch = null;
                status.innerText = "❌ Unknown face";
            }
        }
    },800);
}

// ✅ PROCESS MATCH
async function process(student){
    busy = true;

    document.getElementById("profileCard").style.display = "block";
    document.getElementById("resName").innerText = student.name;
    document.getElementById("resLocation").innerText =
        (student.district || "-");

    document.getElementById("resStatus").innerText =
        student.approved ? "✅ Approved" : "⚠️ Not Approved";

    beep(student.approved);

    if(student.approved){
        await addDoc(collection(db,"attendance"),{
            name: student.name,
            time: serverTimestamp()
        });

        const li = document.createElement("li");
        li.innerText = student.name + " ✔";
        list.prepend(li);
    }

    let bar = document.getElementById("progressBar");
    let wrap = document.getElementById("progressWrap");

    wrap.style.display = "block";

    let t = 0;
    const timer = setInterval(()=>{
        t += 100;
        bar.style.width = (t/3000)*100 + "%";

        if(t>=3000){
            clearInterval(timer);
            wrap.style.display = "none";
            bar.style.width = "0%";
            document.getElementById("profileCard").style.display = "none";
            busy = false;
        }
    },100);
}

// 🚀 INIT SYSTEM
async function init(){
    status.innerText = "Loading AI...";
    await loadModels();

    status.innerText = "Loading students...";
    await loadStudents();

    await startCamera();

    status.innerText = "✅ Ready - Look at camera";
    startScan();
}

init();
</script>

</body>
</html>
