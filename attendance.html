<!DOCTYPE html>
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>NK Biometric Attendance</title>  

    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>  

    <style>  
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f2c; color: #00f7ff; text-align: center; padding: 20px; }  
        h2 { font-size: 1.8rem; margin-bottom: 15px; text-shadow: 0 0 10px #00f7ff; }  
        .video-wrapper { position: relative; display: inline-block; width: 100%; max-width: 400px; aspect-ratio: 4/3; }  
        video { width: 100%; height: 100%; border: 3px solid #00f7ff; border-radius: 12px; background: #000; object-fit: cover; }  
        #scannerOverlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 12px; overflow: hidden; pointer-events: none; }  
        #scannerLine { position: absolute; width: 100%; height: 2px; background: #00f7ff; box-shadow: 0 0 15px #00f7ff; animation: scan 2s linear infinite; }  
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }  
        .progress-container { width: 100%; max-width: 400px; height: 10px; background: #1a264d; margin: 15px auto; border-radius: 5px; display: none; overflow: hidden; }  
        #progressBar { width: 0%; height: 100%; background: #00f7ff; transition: width 0.1s linear; }  
        #profileCard { max-width: 400px; margin: 20px auto; padding: 20px; background: rgba(0,247,255,0.1); border: 2px solid #00f7ff; border-radius: 12px; display: none; }  
        .info-label { color: #aaa; font-size: 0.7rem; text-transform: uppercase; }  
        .info-value { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #fff; }  
        #status { margin-top: 15px; font-weight: bold; }  
        #debugInfo { margin-top: 5px; font-size: 0.8rem; color: #ffaa00; font-family: monospace; }  
        .log-container { margin-top: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: left; max-width: 400px; margin-inline: auto; }  
    </style>  
</head>  

<body>  
    <h2>⏱️ NK Biometric Attendance</h2>  

    <div class="video-wrapper">  
        <video id="video" autoplay muted playsinline></video>  
        <div id="scannerOverlay"><div id="scannerLine"></div></div>  
    </div>  

    <div class="progress-container" id="progressWrap">  
        <div id="progressBar"></div>  
    </div>  

    <p id="status">Loading AI Engine...</p>  
    <p id="debugInfo">Initializing...</p>  

    <div id="profileCard">  
        <div class="info-label">Student Name</div>  
        <div id="resName" class="info-value">-</div>  
        <div class="info-label">Location</div>  
        <div id="resLocation" class="info-value">-</div>  
        <div id="resStatus" style="font-weight: bold;">-</div>  
    </div>  

    <div class="log-container">  
        <h3 style="margin:0 0 10px 0; font-size: 1rem;">Recent Logs:</h3>  
        <ul id="attendanceList" style="list-style: none; padding: 0; margin: 0; font-size: 0.9rem;"></ul>  
    </div>  

    <script type="module">  
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";  
        import { getFirestore, collection, getDocs, addDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  

        const firebaseConfig = {  
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",  
            authDomain: "my-school-project-6e00c.firebaseapp.com",  
            projectId: "my-school-project-6e00c",  
            storageBucket: "my-school-project-6e00c.appspot.com",  
            messagingSenderId: "14283853516",  
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"  
        };  

        const app = initializeApp(firebaseConfig);  
        const db = getFirestore(app);  

        const video = document.getElementById("video");  
        const status = document.getElementById("status");  
        const debugInfo = document.getElementById("debugInfo");  
        const list = document.getElementById("attendanceList");  
        const profileCard = document.getElementById("profileCard");  
        const progressBar = document.getElementById("progressBar");  
        const progressWrap = document.getElementById("progressWrap");  

        let faceMatcher = null;  
        let allStudentsData = [];  
        let isProcessing = false;  

        // CONFIG: 0.6 is the best balance for African lighting/skin tones in face-api.js
        const DISTANCE_THRESHOLD = 0.60;  
        const MATCH_SAMPLES = 2;  
        let matchCounter = 0;  
        let currentMatchLabel = null;  

        async function init(){  
            // Using a more reliable model source to prevent "System Offline" errors
            const MODEL_URL = 'https://raw.githubusercontent.com/vladmandic/face-api/master/model/';  
            
            try {
                status.innerText = "Loading AI Models...";  
                await Promise.all([  
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),  
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)  
                ]);  
                
                debugInfo.innerText = "Models OK. Syncing Database...";
                await loadStudents();  
                await startCamera();  
            } catch (err) {
                status.innerText = "⚠️ System Offline";
                debugInfo.innerText = "Error: " + err.message;
            }
        }  

        async function loadStudents(){  
            try {
                const q = query(collection(db, "students"));  
                const snap = await getDocs(q);  
                const descriptors = [];  
                allStudentsData = [];

                snap.forEach(doc => {  
                    const data = doc.data();  
                    if(data.faceDescriptor && Array.isArray(data.faceDescriptor)){  
                        allStudentsData.push(data);  
                        descriptors.push(new faceapi.LabeledFaceDescriptors(data.name, [new Float32Array(data.faceDescriptor)]));  
                    }  
                });  

                if(descriptors.length > 0){  
                    faceMatcher = new faceapi.FaceMatcher(descriptors, DISTANCE_THRESHOLD);  
                    status.innerText = "System Ready. Align Face.";  
                    debugInfo.innerText = `${descriptors.length} Students Loaded`;
                } else {
                    status.innerText = "No Students Found.";
                }
                runRecognition();  
            } catch (e) {
                debugInfo.innerText = "DB Error: " + e.message;
            }
        }  

        async function startCamera(){  
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });  
            video.srcObject = stream;  
        }  

        async function runRecognition(){  
            setInterval(async () => {  
                if(!faceMatcher || isProcessing) return;  

                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();  
                
                if(detection){  
                    const match = faceMatcher.findBestMatch(detection.descriptor);  
                    debugInfo.innerText = `Dist: ${match.distance.toFixed(3)} | User: ${match.label}`;

                    if(match.label !== 'unknown' && match.distance < DISTANCE_THRESHOLD){  
                        if(currentMatchLabel === match.label) matchCounter++; else { matchCounter = 1; currentMatchLabel = match.label; }

                        if(matchCounter >= MATCH_SAMPLES){  
                            const student = allStudentsData.find(s => s.name === match.label);  
                            if(student) handleSuccess(student);  
                            matchCounter = 0;  
                        }  
                    } else {
                        status.innerText = "Unknown face or too far.";
                        matchCounter = 0;
                    }
                } else {
                    status.innerText = "Looking for face...";
                }  
            }, 600);  
        }  

        async function handleSuccess(info){  
            isProcessing = true;  
            status.innerText = "MATCH FOUND!";
            document.getElementById("resName").innerText = info.name;  
            document.getElementById("resLocation").innerText = `${info.district || '-'} / ${info.village || '-'}`;  
            document.getElementById("resStatus").innerText = "✅ ATTENDANCE MARKED";  
            profileCard.style.display = "block";  
            
            await markAttendance(info);  

            progressWrap.style.display = "block";  
            let progress = 0;  
            const timer = setInterval(() => {  
                progress += 5;  
                progressBar.style.width = progress + "%";  
                if(progress >= 100){ 
                    clearInterval(timer); 
                    isProcessing = false;
                    progressWrap.style.display = "none";
                    progressBar.style.width = "0%";
                    profileCard.style.display = "none";
                    status.innerText = "Ready for next student...";
                }  
            }, 100);  
        }  

        async function markAttendance(info){  
            try {  
                await addDoc(collection(db, "attendance"), { studentName: info.name, time: serverTimestamp() });  
                const li = document.createElement("li");  
                li.innerHTML = `• <strong>${info.name}</strong> - ${new Date().toLocaleTimeString()}`;  
                list.prepend(li);  
                if(list.children.length > 5) list.lastChild.remove();  
            } catch(e) { console.error(e); }  
        }  

        init();  
    </script>  
</body>  
</html>
