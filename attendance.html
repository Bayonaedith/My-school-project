<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NK Biometric Attendance</title>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<style>

body{
font-family:'Segoe UI',sans-serif;
background:#050a14;
color:white;
text-align:center;
padding:20px;
}

/* cyber grid background */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:
linear-gradient(rgba(0,255,255,0.08) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,255,0.08) 1px,transparent 1px);

background-size:40px 40px;
z-index:-1;
}

/* camera */

.camera-box{
position:relative;
display:inline-block;
}

video{
border:3px solid #00f7ff;
border-radius:10px;
width:420px;
background:#000;
box-shadow:0 0 20px rgba(0,247,255,0.3);
}

/* scanning square */

#scanBox{
position:absolute;
border:3px solid #00f7ff;
width:130px;
height:130px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
box-shadow:0 0 15px #00f7ff;
}

.scan-line{
position:absolute;
width:100%;
height:2px;
background:#00f7ff;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

/* progress */

.progress-container{
width:420px;
height:10px;
background:#1a264d;
margin:10px auto;
border-radius:5px;
overflow:hidden;
display:none;
}

#progressBar{
width:0%;
height:100%;
background:#00f7ff;
}

/* profile */

#profileCard{
max-width:420px;
margin:20px auto;
padding:20px;
background:rgba(0,247,255,0.1);
border:2px solid #00f7ff;
border-radius:12px;
display:none;
}

.info-label{
color:#00f7ff;
font-size:0.8rem;
text-transform:uppercase;
margin-top:10px;
}

.info-value{
font-size:1.2rem;
font-weight:bold;
}

#status{
margin-top:15px;
font-size:1.1rem;
color:#00f7ff;
min-height:1.5em;
}

.log-container{
margin-top:20px;
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
display:inline-block;
min-width:350px;
}

</style>

</head>

<body>

<h2>⚡ NK Biometric Attendance Scanner</h2>

<div class="camera-box">

<video id="video" autoplay muted playsinline></video>

<div id="scanBox">
<div class="scan-line"></div>
</div>

</div>

<div class="progress-container" id="progressWrap">
<div id="progressBar"></div>
</div>

<p id="status">Initializing AI Scanner...</p>

<div id="profileCard">

<div class="info-label">Student Name</div>
<div id="resName" class="info-value"></div>

<div class="info-label">Location</div>
<div id="resLocation" class="info-value"></div>

<div id="resStatus" style="margin-top:10px;font-weight:bold;"></div>

</div>

<div class="log-container">

<h3>Recent Logs</h3>
<ul id="attendanceList" style="list-style:none;padding:0;text-align:left;"></ul>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,collection,getDocs,addDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
authDomain:"my-school-project-6e00c.firebaseapp.com",
projectId:"my-school-project-6e00c",
storageBucket:"my-school-project-6e00c.appspot.com",
messagingSenderId:"14283853516",
appId:"1:14283853516:web:c7999ae32d83166cb8bc69"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const video=document.getElementById("video");
const status=document.getElementById("status");
const list=document.getElementById("attendanceList");

const profileCard=document.getElementById("profileCard");

let faceMatcher=null;
let students=[];

function speak(text){
const speech=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(speech);
}

async function init(){

const MODEL_URL='https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
]);

await loadStudents();
startCamera();
scanLoop();

}

async function startCamera(){

const stream=await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;

}

async function loadStudents(){

const snap=await getDocs(collection(db,"students"));

const labeled=[];

snap.forEach(doc=>{

const data=doc.data();

students.push(data);

labeled.push(
new faceapi.LabeledFaceDescriptors(
data.name,
[new Float32Array(data.faceDescriptor)]
)
);

});

faceMatcher=new faceapi.FaceMatcher(labeled,0.45);

status.innerText="System Ready";

}

async function scanLoop(){

setInterval(async()=>{

const detection=await faceapi
.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection) return;

const match=faceMatcher.findBestMatch(detection.descriptor);

if(match.label==="unknown"){

status.innerText="❌ Unknown Face";

speak("Access Denied");

setTimeout(()=>{
window.location.href="registration.html";
},2000);

return;

}

const student=students.find(s=>s.name===match.label);

if(!student) return;

profileCard.style.display="block";

document.getElementById("resName").innerText=student.name;
document.getElementById("resLocation").innerText=
`${student.country} / ${student.district} / ${student.village}`;

/* CHECK APPROVAL */

if(student.approved){

document.getElementById("resStatus").innerText="✅ Attendance Marked";
document.getElementById("resStatus").style.color="#00ff88";

status.innerText="Access Granted";

speak("Access Granted");

await addDoc(collection(db,"attendance"),{

studentName:student.name,
district:student.district,
time:serverTimestamp()

});

const li=document.createElement("li");

li.innerHTML=`✅ ${student.name} - ${new Date().toLocaleTimeString()}`;

list.prepend(li);

}else{

document.getElementById("resStatus").innerText="⏳ Pending Approval";
document.getElementById("resStatus").style.color="#ffaa00";

status.innerText="Student Not Approved";

speak("Account Pending Approval");

}

},900);

}

init();

</script>

</body>
</html>
