<!DOCTYPE html>
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>NK Biometric Attendance</title>  
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>  
    <style>  
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f2c; color: #00f7ff; text-align: center; padding: 20px; margin: 0; }  
        .video-wrapper { position: relative; display: inline-block; width: 100%; max-width: 400px; margin-top: 10px; }  
        video { width: 100%; border: 3px solid #00f7ff; border-radius: 12px; background: #000; }  
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }  
        #status { font-weight: bold; margin-top: 15px; color: #fff; }  
        #debugInfo { font-size: 0.8rem; color: #ffaa00; margin-bottom: 10px; }  
        .log-container { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: left; max-width: 400px; margin: 20px auto; }  
        #profileCard { background: rgba(0,247,255,0.1); border: 2px solid #00f7ff; padding: 15px; border-radius: 12px; display: none; margin: 10px auto; max-width: 400px; }  
    </style>  
</head>  
<body>  
    <h2>⏱️ NK Biometric Attendance</h2>  
    
    <div class="video-wrapper" id="container">  
        <video id="video" autoplay muted playsinline></video>  
    </div>  

    <p id="status">Initializing AI...</p>  
    <p id="debugInfo">Waiting for models...</p>  

    <div id="profileCard">  
        <div style="font-size: 0.7rem;">STUDENT NAME</div>  
        <div id="resName" style="font-size: 1.3rem; font-weight: bold;">-</div>  
        <div id="resStatus" style="color: #00f7ff; margin-top: 5px;">✅ Attendance Marked</div>  
    </div>  

    <div class="log-container">  
        <h4 style="margin: 0 0 10px 0;">Recent Logs:</h4>  
        <ul id="attendanceList" style="list-style: none; padding: 0; margin: 0; font-size: 0.8rem;"></ul>  
    </div>  

    <script type="module">  
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";  
        import { getFirestore, collection, getDocs, addDoc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  

        const firebaseConfig = {  
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",  
            authDomain: "my-school-project-6e00c.firebaseapp.com",  
            projectId: "my-school-project-6e00c",  
            storageBucket: "my-school-project-6e00c.appspot.com",  
            messagingSenderId: "14283853516",  
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"  
        };  

        const app = initializeApp(firebaseConfig);  
        const db = getFirestore(app);  

        const video = document.getElementById("video");  
        const status = document.getElementById("status");  
        const debugInfo = document.getElementById("debugInfo");  
        const profileCard = document.getElementById("profileCard");  
        const list = document.getElementById("attendanceList");  

        let faceMatcher = null;  
        let allStudentsData = [];  
        let isProcessing = false;  

        async function init() {  
            const MODEL_URL = 'https://raw.githubusercontent.com/vladmandic/face-api/master/model/';  
            try {  
                await Promise.all([  
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),  
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),  
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)  
                ]);  
                loadDatabase();  
                startStream();  
            } catch (e) {  
                status.innerText = "Error loading models.";  
                console.error(e);  
            }  
        }  

        async function loadDatabase() {  
            const q = query(collection(db, "students"));  
            const snap = await getDocs(q);  
            const labeled = [];  
            snap.forEach(doc => {  
                const data = doc.data();  
                if(data.faceDescriptor) {  
                    allStudentsData.push(data);  
                    labeled.push(new faceapi.LabeledFaceDescriptors(data.name, [new Float32Array(data.faceDescriptor)]));  
                }  
            });  
            if(labeled.length > 0) {  
                faceMatcher = new faceapi.FaceMatcher(labeled, 0.6);  
                debugInfo.innerText = `${labeled.length} Students Loaded`;  
                startDetection();  
            }  
        }  

        async function startStream() {  
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });  
            video.srcObject = stream;  
        }  

        function startDetection() {  
            const canvas = faceapi.createCanvasFromMedia(video);  
            document.getElementById("container").append(canvas);  
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };  
            faceapi.matchDimensions(canvas, displaySize);  

            setInterval(async () => {  
                if(isProcessing) return;  

                // Lower minConfidence to 0.4 to help with shadows/lighting
                const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 }))  
                    .withFaceLandmarks()  
                    .withFaceDescriptor();  

                const ctx = canvas.getContext('2d');  
                ctx.clearRect(0, 0, canvas.width, canvas.height);  

                if (detection) {  
                    status.innerText = "Face Detected! Analyzing...";  
                    const resized = faceapi.resizeResults(detection, displaySize);  
                    // Draw a blue box to show it's working
                    faceapi.draw.drawDetections(canvas, resized);  

                    const match = faceMatcher.findBestMatch(detection.descriptor);  
                    if (match.label !== 'unknown' && match.distance < 0.6) {  
                        const student = allStudentsData.find(s => s.name === match.label);  
                        if (student) recordAttendance(student);  
                    } else {  
                        debugInfo.innerText = `Unknown (Dist: ${match.distance.toFixed(2)})`;  
                    }  
                } else {  
                    status.innerText = "Looking for face...";  
                }  
            }, 500);  
        }  

        async function recordAttendance(student) {  
            isProcessing = true;  
            document.getElementById("resName").innerText = student.name;  
            profileCard.style.display = "block";  
            
            try {  
                await addDoc(collection(db, "attendance"), { studentName: student.name, time: serverTimestamp() });  
                const li = document.createElement("li");  
                li.innerHTML = `✅ <b>${student.name}</b> - ${new Date().toLocaleTimeString()}`;  
                list.prepend(li);  
            } catch (e) { console.error(e); }  

            setTimeout(() => {  
                profileCard.style.display = "none";  
                isProcessing = false;  
            }, 4000);  
        }  

        init();  
    </script>  
</body>  
</html>
