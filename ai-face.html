<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Biometric Scanner</title>

<style>

body{
background:#0b1220;
font-family:Arial;
color:#0ff;
text-align:center;
margin:0;
}

/* Scanner container */

.scanner{
position:relative;
width:320px;
margin:50px auto;
border:2px solid #00f7ff;
border-radius:10px;
box-shadow:0 0 30px #00f7ff;
overflow:hidden;
}

/* Camera */

video{
width:100%;
}

/* scanning line */

.scan-line{
position:absolute;
width:100%;
height:3px;
background:#00f7ff;
animation:scan 3s infinite;
}

@keyframes scan{
0%{top:0}
50%{top:100%}
100%{top:0}
}

/* HUD panels */

.panel{
background:#081220;
border:1px solid #00f7ff;
padding:10px;
margin:10px;
border-radius:8px;
box-shadow:0 0 10px #00f7ff;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:20px;
}

.big-status{
font-size:22px;
color:#00ff9c;
margin-top:20px;
}

.confidence{
font-size:30px;
color:#00f7ff;
}

</style>
</head>

<body>

<h1>🔍 AI BIOMETRIC ANALYSIS</h1>

<div class="scanner">

<video id="video" autoplay></video>

<div class="scan-line"></div>

</div>

<div class="big-status">IDENTITY SCANNING...</div>

<div class="dashboard">

<div class="panel">
Security Status<br>
🔒 Locked
</div>

<div class="panel">
Match Confidence<br>
<span class="confidence" id="confidence">0%</span>
</div>

<div class="panel">
Network Activity<br>
██████░░░░
</div>

<div class="panel">
AI Processing<br>
████████░
</div>

</div>

<script>

const video=document.getElementById("video")

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream
})

/* fake scanning animation */

let percent=0
setInterval(()=>{
percent=Math.min(100,percent+1)
document.getElementById("confidence").innerText=percent+"%"
},80)

</script>

</body>
</html>
