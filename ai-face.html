<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Biometric System</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0b1220 0%, #1a2d4d 100%);
            font-family: 'Segoe UI', monospace;
            color: #0ff;
            text-align: center;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { font-size: 1.2rem; letter-spacing: 2px; margin: 10px 0; text-transform: uppercase; }

        /* Compact Scanner for Mobile */
        .scanner-container { margin: 5px 0; }
        .scanner-box {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 4 / 3;
            border: 2px solid #00f7ff;
            border-radius: 12px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.3);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #00f7ff;
            box-shadow: 0 0 10px #00f7ff;
            top: 0;
            animation: scan 2s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }

        /* Professional Compact Panels */
        .status-display { font-size: 0.85rem; margin: 10px 0; font-weight: bold; letter-spacing: 1px; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 320px;
            margin: 10px auto;
        }

        .panel {
            background: rgba(8, 18, 32, 0.9);
            border: 1px solid rgba(0, 247, 255, 0.4);
            padding: 8px 4px;
            border-radius: 8px;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-label { font-size: 0.55rem; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .panel-value { font-size: 0.85rem; color: #00ff9c; font-weight: bold; }
        .panel-value.accent { color: #00f7ff; }

        /* Registration UI */
        .reg-container {
            display: none;
            max-width: 300px;
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ffcc00;
        }
        .reg-container.visible { display: block; }
        input {
            width: 100%; padding: 10px; margin-bottom: 8px;
            background: #1a264d; border: 1px solid #00f7ff;
            color: #0ff; border-radius: 5px; font-size: 0.85rem;
        }
        button {
            width: 100%; padding: 12px; background: #00f7ff;
            border: none; border-radius: 5px; font-weight: bold;
            color: #0a0f2c; text-transform: uppercase; font-size: 0.8rem;
        }
        .alert-box { font-size: 0.7rem; padding: 8px; margin-top: 8px; display: none; border-radius: 4px; }
        .alert-box.visible { display: block; }
    </style>
</head>
<body>

    <h1>🔍 BIOMETRIC AI</h1>

    <div class="scanner-container">
        <div class="scanner-box">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-line"></div>
        </div>
    </div>

    <div id="status-text" class="status-display">INITIALIZING...</div>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-label">Security</div>
            <div class="panel-value" id="lock-status">🔒 LOCKED</div>
        </div>
        <div class="panel">
            <div class="panel-label">Confidence</div>
            <div class="panel-value accent" id="confidence">0%</div>
        </div>
        <div class="panel">
            <div class="panel-label">Subject</div>
            <div class="panel-value" id="subject-name">SCANNING</div>
        </div>
        <div class="panel">
            <div class="panel-label">Database</div>
            <div class="panel-value" id="db-status" style="color: #ffcc00;">SYNCING</div>
        </div>
    </div>

    <div id="reg-section" class="reg-container">
        <h3 style="font-size:0.9rem; color:#ffcc00; margin-bottom:10px;">REGISTRATION</h3>
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="country" placeholder="Country">
        <input type="text" id="district" placeholder="District">
        <input type="text" id="village" placeholder="Village">
        <button id="regBtn">REGISTER FACE</button>
        <div id="alertMsg" class="alert-box"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const state = { db: null, faceMatcher: null, allStudents: [], isProcessing: false };
        const elements = {
            video: document.getElementById("video"),
            statusEl: document.getElementById("status-text"),
            confidenceEl: document.getElementById("confidence"),
            lockEl: document.getElementById("lock-status"),
            subjectEl: document.getElementById("subject-name"),
            dbStatusEl: document.getElementById("db-status"),
            regSection: document.getElementById("reg-section"),
            regBtn: document.getElementById("regBtn"),
            alertMsg: document.getElementById("alertMsg"),
            nameInput: document.getElementById("name"),
            countryInput: document.getElementById("country"),
            districtInput: document.getElementById("district"),
            villageInput: document.getElementById("village")
        };

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                state.db = getFirestore(app);
                
                const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                // Mobile-friendly resolution for speed
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320, height: 240, facingMode: 'user' } 
                });
                elements.video.srcObject = stream;

                await loadDatabase();
                elements.statusEl.textContent = "SYSTEM ACTIVE";
                setInterval(processFrame, 1000);
            } catch (e) {
                elements.statusEl.textContent = "INIT ERROR";
            }
        }

        async function loadDatabase() {
            const snap = await getDocs(collection(state.db, "students"));
            const labeled = [];
            snap.forEach(doc => {
                const data = doc.data();
                state.allStudents.push(data);
                if (data.approved && data.faceDescriptor) {
                    labeled.push(new faceapi.LabeledFaceDescriptors(data.name, [new Float32Array(data.faceDescriptor)]));
                }
            });
            if (labeled.length) state.faceMatcher = new faceapi.FaceMatcher(labeled, 0.45);
            elements.dbStatusEl.textContent = "ONLINE";
            elements.dbStatusEl.style.color = "#00ff9c";
        }

        async function processFrame() {
            if (state.isProcessing) return;
            const det = await faceapi.detectSingleFace(elements.video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            
            if (det) {
                const conf = Math.round((1 - det.descriptor[0]) * 100);
                elements.confidenceEl.textContent = `${Math.min(conf, 99)}%`;

                if (state.faceMatcher) {
                    const match = state.faceMatcher.findBestMatch(det.descriptor);
                    if (match.label !== 'unknown') {
                        const student = state.allStudents.find(s => s.name === match.label);
                        handleSuccess(student);
                        return;
                    }
                }
                elements.subjectEl.textContent = "UNKNOWN";
                elements.regSection.classList.add('visible');
            } else {
                elements.confidenceEl.textContent = "0%";
                elements.subjectEl.textContent = "SCANNING";
            }
        }

        async function handleSuccess(student) {
            state.isProcessing = true;
            elements.statusEl.textContent = "ACCESS GRANTED";
            elements.lockEl.textContent = "🔓 OPEN";
            elements.subjectEl.textContent = student.name.toUpperCase();
            
            await addDoc(collection(state.db, "attendance"), {
                studentName: student.name,
                district: student.district,
                timestamp: serverTimestamp()
            });

            setTimeout(() => {
                sessionStorage.setItem('studentData', JSON.stringify(student));
                window.location.href = './attendance.html';
            }, 2000);
        }

        elements.regBtn.addEventListener('click', async () => {
            const data = { 
                name: elements.nameInput.value, 
                country: elements.countryInput.value, 
                district: elements.districtInput.value, 
                village: elements.villageInput.value 
            };
            if (!data.name) return;
            
            const det = await faceapi.detectSingleFace(elements.video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (det) {
                await addDoc(collection(state.db, "students"), { 
                    ...data, 
                    faceDescriptor: Array.from(det.descriptor), 
                    approved: false, 
                    createdAt: serverTimestamp() 
                });
                location.reload();
            }
        });

        init();
    </script>
</body>
</html>
