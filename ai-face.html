<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE-CORE | Biometric Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root {
            --glow-color: #00f7ff;
            --bg-dark: #050a14;
            --panel-bg: rgba(10, 25, 41, 0.7);
        }

        body { 
            background: var(--bg-dark); 
            font-family: 'Segoe UI', 'Courier New', monospace; 
            color: var(--glow-color); 
            margin: 0; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #102a43 0%, #050a14 100%);
        }

        /* Futuristic Header */
        .header {
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-left: 4px solid var(--glow-color);
            padding-left: 15px;
            text-shadow: 0 0 15px var(--glow-color);
        }

        /* The Main Scanner Container */
        .viewport {
            position: relative;
            width: 640px;
            height: 480px;
            border: 1px solid rgba(0, 247, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Decorative UI Corners */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--glow-color);
            z-index: 20;
        }
        .top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Scanning Animation Line */
        .scan-bar {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--glow-color);
            box-shadow: 0 0 20px 2px var(--glow-color);
            z-index: 15;
            animation: moveScan 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes moveScan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Dashboard Styling */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(4, 160px); 
            gap: 10px; 
            margin-top: 25px; 
        }

        .panel { 
            background: var(--panel-bg); 
            border: 1px solid rgba(0, 247, 255, 0.2); 
            padding: 12px; 
            backdrop-filter: blur(10px);
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .data-val {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 5px;
            color: #fff;
            text-shadow: 0 0 5px var(--glow-color);
        }

        #status-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 25;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span style="opacity: 0.6;">System:</span> Biometric Analysis v2.4
    </div>

    <div class="viewport">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="scan-bar"></div>
        
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>

        <div id="status-display">SYSTEM IDLE</div>
    </div>

    <div class="dashboard">
        <div class="panel">Identity<br><span class="data-val" id="subject-name">---</span></div>
        <div class="panel">Confidence<br><span class="data-val" id="confidence">0%</span></div>
        <div class="panel">Security<br><span class="data-val" id="lock-status">LOCKED</span></div>
        <div class="panel">Database<br><span class="data-val" id="db-status" style="color: #f1c40f;">WAITING</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Your Firebase Config (Keep this secure!)
        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const video = document.getElementById("video");
        const canvas = document.getElementById("overlay");
        const statusEl = document.getElementById("status-display");
        const confidenceEl = document.getElementById("confidence");
        const lockEl = document.getElementById("lock-status");
        const subjectEl = document.getElementById("subject-name");
        const dbStatusEl = document.getElementById("db-status");

        let faceMatcher = null;
        let allStudentsData = [];
        let isProcessing = false;

        async function init() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            try {
                statusEl.innerText = "LOADING AI MODULES...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                await loadStudents();

                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                
                // Match canvas size to video size
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusEl.innerText = "BIOMETRIC SCANNER READY";
                    startRecognitionLoop();
                };
            } catch (err) {
                statusEl.innerText = "CRITICAL SYSTEM ERROR";
                console.error(err);
            }
        }

        async function loadStudents() {
            const q = query(collection(db, "students"), where("approved", "==", true));
            const querySnapshot = await getDocs(q);
            const labeledDescriptors = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                allStudentsData.push(data);
                const desc = new Float32Array(data.faceDescriptor);
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.name, [desc]));
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                dbStatusEl.innerText = "SYNCED";
                dbStatusEl.style.color = "#00ff9c";
            }
        }

        function startRecognitionLoop() {
            const ctx = canvas.getContext('2d');

            setInterval(async () => {
                if (isProcessing) return;

                const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (detections) {
                    // DRAW HOLOGRAPHIC MESH
                    const drawOptions = {
                        drawLines: true,
                        color: 'rgba(0, 247, 255, 0.7)',
                        lineWidth: 1
                    };
                    faceapi.draw.drawFaceLandmarks(canvas, detections);

                    // MATCHING LOGIC
                    if (faceMatcher) {
                        const bestMatch = faceMatcher.findBestMatch(detections.descriptor);
                        const confidencePercent = Math.round((1 - bestMatch.distance) * 100);
                        confidenceEl.innerText = confidencePercent + "%";

                        if (bestMatch.label !== 'unknown' && confidencePercent > 55) {
                            const studentInfo = allStudentsData.find(s => s.name === bestMatch.label);
                            handleSuccess(studentInfo);
                        }
                    }
                } else {
                    confidenceEl.innerText = "0%";
                    subjectEl.innerText = "---";
                }
            }, 100); // Faster refresh for smoother UI mesh
        }

        async function handleSuccess(info) {
            isProcessing = true;
            statusEl.innerText = "VERIFICATION SUCCESSFUL";
            statusEl.style.color = "#00ff9c";
            lockEl.innerText = "GRANTED";
            lockEl.style.color = "#00ff9c";
            subjectEl.innerText = info.name;

            await addDoc(collection(db, "attendance"), {
                studentName: info.name,
                time: serverTimestamp()
            });

            setTimeout(() => {
                isProcessing = false;
                statusEl.innerText = "BIOMETRIC SCANNER READY";
                statusEl.style.color = "var(--glow-color)";
                lockEl.innerText = "LOCKED";
                lockEl.style.color = "#fff";
                subjectEl.innerText = "---";
            }, 4000);
        }

        init();
    </script>
</body>
</html>
