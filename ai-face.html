<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Biometric Analysis & Registration</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body { background: #0b1220; font-family: 'Courier New', monospace; color: #0ff; text-align: center; margin: 0; padding: 20px; }
        h1 { letter-spacing: 5px; text-shadow: 0 0 10px #0ff; font-size: 1.5rem; }
        
        /* Scanner UI */
        .scanner-box {
            position: relative; width: 320px; height: 240px; margin: 20px auto;
            border: 2px solid #00f7ff; border-radius: 10px; box-shadow: 0 0 20px #00f7ff;
            background: #000; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line {
            position: absolute; width: 100%; height: 4px; background: #00f7ff;
            box-shadow: 0 0 15px 5px rgba(0, 247, 255, 0.7); top: 0; 
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: 0 auto; }
        .panel { background: rgba(8, 18, 32, 0.8); border: 1px solid #00f7ff; padding: 12px; border-radius: 8px; font-size: 0.8rem; }
        .big-status { font-size: 1.2rem; color: #0ff; margin: 15px 0; font-weight: bold; text-transform: uppercase; }
        .confidence { font-size: 1.5rem; color: #0ff; font-weight: bold; }

        /* Registration Form */
        .reg-container { 
            display: none; max-width: 450px; margin: 20px auto; 
            background: rgba(255, 255, 255, 0.05); padding: 20px; 
            border-radius: 15px; border: 1px solid #ffcc00; 
        }
        input { padding: 12px; margin: 8px 0; width: 85%; border: none; border-radius: 5px; background: #1a264d; color: white; border: 1px solid #00f7ff; }
        button { padding: 15px; margin-top: 15px; background: #00f7ff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #0a0f2c; width: 90%; }
        .pending-box { color: #ffcc00; border: 1px solid #ffcc00; padding: 10px; margin-top: 10px; display: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🔍 AI BIOMETRIC ANALYSIS</h1>

    <div class="scanner-box">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-line"></div>
    </div>

    <div id="status-text" class="big-status">INITIALIZING AI...</div>

    <div class="dashboard">
        <div class="panel">Security Status<br><span id="lock-status">🔒 Locked</span></div>
        <div class="panel">Match Confidence<br><span class="confidence" id="confidence">0%</span></div>
        <div class="panel">Identified Subject<br><span id="subject-name" style="color:#00ff9c;">Scanning...</span></div>
        <div class="panel">Firebase Link<br><span id="db-status" style="color:yellow;">Connecting...</span></div>
    </div>

    <div id="reg-section" class="reg-container">
        <h2 style="color: #ffcc00; margin-top: 0;">🎓 Student Registration</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="country" placeholder="Country">
        <input type="text" id="district" placeholder="District">
        <input type="text" id="village" placeholder="Village">
        <button id="regBtn">Check & Register Face</button>
        <div id="pendingMsg" class="pending-box">⚠️ Your registration is still pending admin approval.</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const video = document.getElementById("video");
        const statusEl = document.getElementById("status-text");
        const confidenceEl = document.getElementById("confidence");
        const lockEl = document.getElementById("lock-status");
        const subjectEl = document.getElementById("subject-name");
        const dbStatusEl = document.getElementById("db-status");
        const regSection = document.getElementById("reg-section");

        let faceMatcher = null;
        let allStudentsData = [];
        let isProcessing = false;

        async function init() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                await loadStudents();
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;
                statusEl.innerText = "SYSTEM ACTIVE";
                startRecognitionLoop();
            } catch (err) {
                statusEl.innerText = "SYSTEM ERROR";
            }
        }

        async function loadStudents() {
            const querySnapshot = await getDocs(collection(db, "students"));
            const labeledDescriptors = [];
            allStudentsData = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                allStudentsData.push(data);
                if (data.approved) {
                    const desc = new Float32Array(data.faceDescriptor);
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(data.name, [desc]));
                }
            });

            if (labeledDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                dbStatusEl.innerText = "CONNECTED";
                dbStatusEl.style.color = "#00ff9c";
            } else {
                dbStatusEl.innerText = "NO DATA";
            }
        }

        async function startRecognitionLoop() {
            setInterval(async () => {
                if (isProcessing) return;

                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (detection) {
                    if (faceMatcher) {
                        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                        const confidencePercent = Math.round((1 - bestMatch.distance) * 100);
                        confidenceEl.innerText = confidencePercent + "%";

                        if (bestMatch.label !== 'unknown') {
                            const info = allStudentsData.find(s => s.name === bestMatch.label);
                            handleAttendanceSuccess(info);
                        } else {
                            handleUnknownFace(detection.descriptor);
                        }
                    } else {
                        handleUnknownFace(detection.descriptor);
                    }
                } else {
                    confidenceEl.innerText = "0%";
                    subjectEl.innerText = "Scanning...";
                }
            }, 1000);
        }

        async function handleAttendanceSuccess(info) {
            isProcessing = true;
            statusEl.innerText = "ACCESS GRANTED";
            lockEl.innerText = "🔓 Unlocked";
            subjectEl.innerText = info.name;
            regSection.style.display = "none";

            await addDoc(collection(db, "attendance"), {
                studentName: info.name,
                district: info.district,
                time: serverTimestamp()
            });

            setTimeout(() => {
                isProcessing = false;
                statusEl.innerText = "SYSTEM ACTIVE";
                lockEl.innerText = "🔒 Locked";
                subjectEl.innerText = "Scanning...";
            }, 5000);
        }

        function handleUnknownFace(descriptor) {
            // Check if this unknown face is actually a "Pending" student
            let isPending = false;
            allStudentsData.forEach(s => {
                if(!s.approved) {
                    const dist = faceapi.euclideanDistance(descriptor, new Float32Array(s.faceDescriptor));
                    if(dist < 0.5) isPending = true;
                }
            });

            if (isPending) {
                statusEl.innerText = "PENDING APPROVAL";
                subjectEl.innerText = "AWAITING ADMIN";
                document.getElementById("pendingMsg").style.display = "block";
                regSection.style.display = "block"; // Keep visible but show pending message
            } else {
                statusEl.innerText = "UNKNOWN - REGISTERING";
                subjectEl.innerText = "NOT IN SYSTEM";
                regSection.style.display = "block";
                document.getElementById("pendingMsg").style.display = "none";
            }
        }

        document.getElementById("regBtn").addEventListener('click', async () => {
            const name = document.getElementById("name").value.trim();
            const country = document.getElementById("country").value.trim();
            const district = document.getElementById("district").value.trim();
            const village = document.getElementById("village").value.trim();

            if (!name || !country || !district || !village) {
                statusEl.innerText = "FILL ALL DETAILS";
                return;
            }

            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceDescriptor();
            
            if (detection) {
                await addDoc(collection(db, "students"), {
                    name, country, district, village,
                    faceDescriptor: Array.from(detection.descriptor),
                    approved: false,
                    createdAt: serverTimestamp()
                });
                statusEl.innerText = "REGISTRATION SAVED";
                location.reload();
            }
        });

        init();
    </script>
</body>
</html>
