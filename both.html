<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Object & Face Detection</title>

<!-- Face API -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<!-- TensorFlow & Coco-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:linear-gradient(135deg,#0b1220,#1a2d4d);
font-family:'Segoe UI',sans-serif;
color:#0ff;
text-align:center;
padding:10px;
min-height:100vh;
}
h1{font-size:1.2rem;letter-spacing:2px;margin:10px 0;text-transform:uppercase;color:#ffcc00;}
.scanner-box{position:relative;width:150px;height:150px;border:2px solid #00f7ff;border-radius:50%;margin:auto;overflow:hidden;background:#000;box-shadow:0 0 15px rgba(0,247,255,0.3);}
video{width:100%;height:100%;object-fit:cover;}
.scan-line{position:absolute;width:100%;height:2px;background:#00f7ff;animation:scan 2s linear infinite;}
@keyframes scan{0%{top:0}100%{top:100%}}
.reg-container{max-width:320px;margin:auto;background:rgba(255,255,255,0.05);padding:20px;border-radius:12px;border:1px solid rgba(0,247,255,0.3);}
input{width:100%;padding:12px;margin-top:6px;margin-bottom:8px;background:#1a264d;border:1px solid #00f7ff;color:#fff;border-radius:6px;}
button{width:100%;padding:14px;background:#00f7ff;border:none;border-radius:6px;font-weight:bold;margin-top:10px;}
#status-msg{margin-top:10px;font-size:13px;}
.success{color:#00ff9c;}
.error{color:#ff4444;}
</style>
</head>
<body>

<h1>AI Object & Biometric Detection</h1>

<div class="reg-container">

<div class="scanner-box">
<video id="video" autoplay muted playsinline></video>
<div class="scan-line"></div>
</div>

<input id="name" placeholder="Full Name">
<input id="country" placeholder="Country">
<input id="district" placeholder="District">
<input id="village" placeholder="Village">

<button id="regBtn">Register Face</button>

<div id="status-msg"></div>

</div>

<script type="module">

// Firebase imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config
const firebaseConfig={
apiKey:"AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
authDomain:"my-school-project-6e00c.firebaseapp.com",
projectId:"my-school-project-6e00c",
storageBucket:"my-school-project-6e00c.appspot.com",
messagingSenderId:"14283853516",
appId:"1:14283853516:web:c7999ae32d83166cb8bc69"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// DOM elements
const video=document.getElementById("video");
const regBtn=document.getElementById("regBtn");
const msg=document.getElementById("status-msg");

// Face API stability constants
const DISTANCE_THRESHOLD = 0.45;
const CONFIDENCE_MIN = 0.55;
const CONSECUTIVE_MATCHES_REQUIRED = 2;

let consecutiveMatches = 0;
let lastMatchName = null;
let faceAlreadyRegistered=false;

// Status message helper
function status(text,type=""){
  msg.textContent=text;
  msg.className=type;
}

// Start camera
async function startCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:"user",width:480,height:480}});
  video.srcObject=stream;
}

// Load models
async function loadModels(){
  const MODEL_URL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  window.objectModel = await cocoSsd.load(); // load Coco-SSD
}

// Check existing face
async function checkExistingFace(descriptor){
  const snapshot=await getDocs(collection(db,"students"));
  for(const doc of snapshot.docs){
    const data=doc.data();
    if(!data.faceDescriptor) continue;
    const saved=new Float32Array(data.faceDescriptor);
    const distance=faceapi.euclideanDistance(descriptor,saved);
    const confidence=1-distance;
    if(distance<DISTANCE_THRESHOLD && confidence>CONFIDENCE_MIN){
      if(lastMatchName===data.name){ consecutiveMatches++; }
      else { lastMatchName=data.name; consecutiveMatches=1; }
      if(consecutiveMatches>=CONSECUTIVE_MATCHES_REQUIRED) return true;
    } else { consecutiveMatches=0; lastMatchName=null; }
  }
  return false;
}

// Step-by-step object explanation
function explainObject(prediction){
  const label = prediction.class;
  const score = (prediction.score*100).toFixed(0);
  let explanation = `I see a ${label} (${score}% confidence)`;
  switch(label){
    case 'bottle': explanation += " → looks like a water bottle"; break;
    case 'chair': explanation += " → looks like a chair"; break;
    case 'person': explanation += " → I see a human, ready to register"; break;
    default: explanation += " → interesting object detected"; break;
  }
  status(explanation, 'success');
  return label;
}

// Auto scan for objects & humans
async function detectFrame(){
  const predictions = await window.objectModel.detect(video);
  if(predictions.length > 0){
    for(const p of predictions){
      const label = explainObject(p);
      if(label==='person'){
        await triggerFaceRegistration();
        break; // Only trigger once per frame
      }
    }
  }
  requestAnimationFrame(detectFrame);
}

// Trigger registration when human detected
async function triggerFaceRegistration(){
  if(faceAlreadyRegistered) return;
  const detection = await faceapi
    .detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();
  if(!detection) return;
  const descriptor = detection.descriptor;
  const exists = await checkExistingFace(descriptor);
  if(exists){
    faceAlreadyRegistered=true;
    status("Face already registered → Redirecting to attendance","success");
    setTimeout(()=>{ window.location.href="attendance.html"; },2000);
  } else {
    status("New human detected. Fill form to register.","success');
  }
}

// Manual registration button
regBtn.onclick = async ()=>{
  if(faceAlreadyRegistered){ status("Already registered","error"); return; }
  const name=document.getElementById("name").value.trim();
  const country=document.getElementById("country").value.trim();
  const district=document.getElementById("district").value.trim();
  const village=document.getElementById("village").value.trim();
  if(!name||!country||!district||!village){ status("Fill all fields","error"); return; }
  const detection = await faceapi
    .detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();
  if(!detection){ status("Face not detected","error"); return; }
  const descriptor = detection.descriptor;
  try{
    await addDoc(collection(db,"students"),{
      name,country,district,village,
      faceDescriptor:Array.from(descriptor),
      approved:false,
      createdAt:serverTimestamp()
    });
    status("Registration successful","success");
  }catch(e){ status("Database error","error"); }
}

// Initialize everything
async function init(){
  status("Loading AI models...");
  await loadModels();
  await startCamera();
  status("AI system ready");
  detectFrame(); // start real-time object detection
}

init();

</script>
</body>
  </html>
