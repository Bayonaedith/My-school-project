<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Student Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f2c; color: white; padding: 20px; }
        h1, h2 { color: #00f7ff; text-align: center; }
        .section-container { max-width: 900px; margin: 20px auto; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        th { background: #1a264d; color: #00f7ff; }
        
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; transition: 0.3s; }
        .btn-approve { background: #00f7ff; color: #0a0f2c; }
        .btn-delete { background: #ff4b2b; color: white; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        .empty-msg { text-align: center; color: #888; padding: 20px; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-pending { background: #ffcc00; color: black; }
        .badge-approved { background: #00ff88; color: black; }
    </style>
</head>
<body>

    <h1>🔐 Admin Dashboard</h1>

    <div class="section-container">
        <h2>⏳ Pending Approval</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location (C/D/V)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="pendingTable"></tbody>
        </table>
        <div id="noPending" class="empty-msg" style="display:none;">No pending requests.</div>
    </div>

    <div class="section-container">
        <h2>✅ Approved Students</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location (C/D/V)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="approvedTable"></tbody>
        </table>
        <div id="noApproved" class="empty-msg" style="display:none;">No approved students yet.</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const pendingTable = document.getElementById("pendingTable");
        const approvedTable = document.getElementById("approvedTable");

        // Listen for all students
        const q = query(collection(db, "students"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            pendingTable.innerHTML = "";
            approvedTable.innerHTML = "";
            
            let pendingCount = 0;
            let approvedCount = 0;

            snapshot.forEach((studentDoc) => {
                const s = studentDoc.data();
                const id = studentDoc.id;
                const location = `${s.country || '-'} / ${s.district || '-'} / ${s.village || '-'}`;
                
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><strong>${s.name}</strong></td>
                    <td>${location}</td>
                    <td><span class="badge ${s.approved ? 'badge-approved' : 'badge-pending'}">${s.approved ? 'Approved' : 'Pending'}</span></td>
                    <td>
                        ${!s.approved ? `<button class="btn btn-approve" onclick="updateStatus('${id}', true)">Approve</button>` : ''}
                        <button class="btn btn-delete" onclick="deleteUser('${id}', '${s.name}')">Delete</button>
                    </td>
                `;

                if (s.approved) {
                    approvedTable.appendChild(row);
                    approvedCount++;
                } else {
                    pendingTable.appendChild(row);
                    pendingCount++;
                }
            });

            document.getElementById("noPending").style.display = pendingCount === 0 ? "block" : "none";
            document.getElementById("noApproved").style.display = approvedCount === 0 ? "block" : "none";
        });

        // ACTION: Approve Student
        window.updateStatus = async (id, status) => {
            try {
                await updateDoc(doc(db, "students", id), { approved: status });
            } catch (err) { alert("Error: " + err.message); }
        };

        // ACTION: Delete Student
        window.deleteUser = async (id, name) => {
            if (confirm(`Are you sure you want to PERMANENTLY delete ${name}?`)) {
                try {
                    await deleteDoc(doc(db, "students", id));
                } catch (err) { alert("Error: " + err.message); }
            }
        };
    </script>
</body>
</html>
