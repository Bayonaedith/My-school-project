<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Super Dashboard</title>
    <style>
        :root { --neon: #00f7ff; --bg: #0a0f2c; --card: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        
        /* Navigation */
        nav { background: rgba(0,0,0,0.5); padding: 15px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid var(--neon); margin-bottom: 30px; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 16px; border-radius: 5px; transition: 0.3s; }
        nav a:hover { background: var(--neon); color: var(--bg); }

        h1, h2 { color: var(--neon); text-align: center; }
        .section-container { max-width: 1000px; margin: 20px auto; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        th { background: #1a264d; color: var(--neon); }
        
        /* Buttons & Badges */
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; transition: 0.3s; }
        .btn-approve { background: var(--neon); color: #0a0f2c; }
        .btn-delete { background: #ff4b2b; color: white; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #ffcc00; color: black; }
        .badge-approved { background: #00ff88; color: black; }
        
        .empty-msg { text-align: center; color: #888; padding: 20px; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>

    <nav>
        <a href="#management">User Management</a>
        <a href="#reports">Attendance Logs</a>
    </nav>

    <h1>🔐 Admin Control Center</h1>

    <div id="management" class="section-container">
        <h2>👥 Student Management</h2>
        
        <h3>⏳ Pending Approval</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location (C/D/V)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="pendingTable"></tbody>
        </table>
        <div id="noPending" class="empty-msg" style="display:none;">No pending requests.</div>

        <h3 style="margin-top: 40px;">✅ Approved Students</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location (C/D/V)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="approvedTable"></tbody>
        </table>
        <div id="noApproved" class="empty-msg" style="display:none;">No approved students.</div>
    </div>

    <div id="reports" class="section-container" style="border-color: #00ff88;">
        <h2>📅 Live Attendance Report</h2>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>District</th>
                    <th>Date & Time</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- PART 1: STUDENT MANAGEMENT LOGIC ---
        const pendingTable = document.getElementById("pendingTable");
        const approvedTable = document.getElementById("approvedTable");

        onSnapshot(query(collection(db, "students"), orderBy("createdAt", "desc")), (snapshot) => {
            pendingTable.innerHTML = "";
            approvedTable.innerHTML = "";
            let pCount = 0, aCount = 0;

            snapshot.forEach((studentDoc) => {
                const s = studentDoc.data();
                const id = studentDoc.id;
                const location = `${s.country || '-'} / ${s.district || '-'} / ${s.village || '-'}`;
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td><strong>${s.name}</strong></td>
                    <td>${location}</td>
                    <td>
                        ${!s.approved ? `<button class="btn btn-approve" onclick="updateStatus('${id}', true)">Approve</button>` : ''}
                        <button class="btn btn-delete" onclick="deleteUser('${id}', '${s.name}')">Delete</button>
                    </td>
                `;

                if (s.approved) { approvedTable.appendChild(row); aCount++; } 
                else { pendingTable.appendChild(row); pCount++; }
            });
            document.getElementById("noPending").style.display = pCount === 0 ? "block" : "none";
            document.getElementById("noApproved").style.display = aCount === 0 ? "block" : "none";
        });

        // --- PART 2: ATTENDANCE LOGIC ---
        const reportTable = document.getElementById("attendanceTableBody");
        onSnapshot(query(collection(db, "attendance"), orderBy("time", "desc")), (snapshot) => {
            reportTable.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.time ? data.time.toDate().toLocaleString() : "Syncing...";
                const row = document.createElement("tr");
                row.innerHTML = `<td>${data.studentName}</td><td>${data.district || 'N/A'}</td><td>${date}</td>`;
                reportTable.appendChild(row);
            });
        });

        // --- GLOBAL ACTIONS ---
        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "students", id), { approved: status });
        };

        window.deleteUser = async (id, name) => {
            if (confirm(`Delete ${name} permanently?`)) {
                await deleteDoc(doc(db, "students", id));
            }
        };
    </script>
</body>
</html>
