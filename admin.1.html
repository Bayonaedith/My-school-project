<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Super Dashboard v2.1</title>
    <style>
        :root { --neon: #00f7ff; --bg: #0a0f2c; --card: rgba(255, 255, 255, 0.05); --danger: #ff4b2b; --warning: #ffcc00; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; scroll-behavior: smooth; }
        
        /* Navigation & Search */
        .sticky-header { position: sticky; top: 0; z-index: 100; background: #060b1f; padding: 15px; border-bottom: 1px solid var(--neon); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .nav-wrapper { max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .nav-links { display: flex; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 12px; border-radius: 5px; transition: 0.3s; font-size: 0.9rem; }
        nav a:hover { background: var(--neon); color: var(--bg); }

        #globalSearch { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid var(--neon); background: #1a264d; color: white; outline: none; }

        .section-container { max-width: 1000px; margin: 30px auto; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h2 { color: var(--neon); margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .count-badge { font-size: 1rem; background: var(--neon); color: var(--bg); padding: 2px 10px; border-radius: 20px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        th { background: #1a264d; color: var(--neon); position: sticky; top: 70px; }
        
        .btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px; }
        .btn-approve { background: var(--neon); color: #0a0f2c; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-clear { background: none; border: 1px solid var(--danger); color: var(--danger); }
        .btn-clear:hover { background: var(--danger); color: white; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        .hidden-row { display: none; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="nav-wrapper">
            <nav class="nav-links">
                <a href="#management">Management</a>
                <a href="#reports">Attendance Logs</a>
            </nav>
            <input type="text" id="globalSearch" placeholder="🔍 Search name, district, village..." onkeyup="doGlobalSearch()">
        </div>
    </div>

    <div id="management" class="section-container">
        <h2>👥 Student Management <span class="count-badge" id="totalStudents">0</span></h2>
        <h3>⏳ Pending Approval</h3>
        <table id="pTable">
            <thead><tr><th>Name</th><th>Location</th><th>Actions</th></tr></thead>
            <tbody id="pendingTable"></tbody>
        </table>
        <h3 style="margin-top: 40px;">✅ Approved Students</h3>
        <table id="aTable">
            <thead><tr><th>Name</th><th>Location</th><th>Actions</th></tr></thead>
            <tbody id="approvedTable"></tbody>
        </table>
    </div>

    <div id="reports" class="section-container" style="border-color: #00ff88;">
        <h2>
            <span>📅 Attendance Logs <span class="count-badge" id="totalLogs" style="background:#00ff88">0</span></span>
            <div class="header-actions">
                <button class="btn btn-clear" onclick="deleteAllLogs()">🗑️ Delete All Logs</button>
            </div>
        </h2>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>District</th>
                    <th>Date & Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc, deleteDoc, getDocs, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIu9Gi-TGqdjCsCxsyxyq1qV23pxVHOaI",
            authDomain: "my-school-project-6e00c.firebaseapp.com",
            projectId: "my-school-project-6e00c",
            storageBucket: "my-school-project-6e00c.appspot.com",
            messagingSenderId: "14283853516",
            appId: "1:14283853516:web:c7999ae32d83166cb8bc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- REAL-TIME STUDENT UPDATES ---
        onSnapshot(query(collection(db, "students"), orderBy("name", "asc")), (snapshot) => {
            const pendingTable = document.getElementById("pendingTable");
            const approvedTable = document.getElementById("approvedTable");
            pendingTable.innerHTML = ""; approvedTable.innerHTML = "";
            
            snapshot.forEach((studentDoc) => {
                const s = studentDoc.data();
                const id = studentDoc.id;
                const searchStr = `${s.name} ${s.country} ${s.district} ${s.village}`.toLowerCase();
                const row = document.createElement("tr");
                row.className = "searchable-row";
                row.setAttribute("data-search", searchStr);
                row.innerHTML = `
                    <td><strong>${s.name}</strong></td>
                    <td>${s.country || '-'}/${s.district || '-'}/${s.village || '-'}</td>
                    <td>
                        ${!s.approved ? `<button class="btn btn-approve" onclick="updateStatus('${id}', true)">Approve</button>` : ''}
                        <button class="btn btn-delete" onclick="deleteItem('students', '${id}', '${s.name}')">Delete</button>
                    </td>
                `;
                s.approved ? approvedTable.appendChild(row) : pendingTable.appendChild(row);
            });
            document.getElementById("totalStudents").innerText = snapshot.size;
            doGlobalSearch(); 
        });

        // --- REAL-TIME ATTENDANCE UPDATES ---
        onSnapshot(query(collection(db, "attendance"), orderBy("time", "desc")), (snapshot) => {
            const reportTable = document.getElementById("attendanceTableBody");
            reportTable.innerHTML = "";
            snapshot.forEach((aDoc) => {
                const data = aDoc.data();
                const id = aDoc.id;
                const date = data.time ? data.time.toDate().toLocaleString() : "Syncing...";
                const searchStr = `${data.studentName} ${data.district}`.toLowerCase();
                const row = document.createElement("tr");
                row.className = "searchable-row";
                row.setAttribute("data-search", searchStr);
                row.innerHTML = `
                    <td>${data.studentName}</td>
                    <td>${data.district || 'N/A'}</td>
                    <td>${date}</td>
                    <td><button class="btn btn-delete" onclick="deleteItem('attendance', '${id}', 'this log')">Delete</button></td>
                `;
                reportTable.appendChild(row);
            });
            document.getElementById("totalLogs").innerText = snapshot.size;
            doGlobalSearch();
        });

        // --- SEARCH LOGIC ---
        window.doGlobalSearch = () => {
            const term = document.getElementById("globalSearch").value.toLowerCase();
            document.querySelectorAll(".searchable-row").forEach(row => {
                const text = row.getAttribute("data-search");
                row.classList.toggle("hidden-row", !text.includes(term));
            });
        };

        // --- ACTIONS ---
        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "students", id), { approved: status });
        };

        window.deleteItem = async (coll, id, label) => {
            if (confirm(`Confirm: Delete ${label}?`)) {
                await deleteDoc(doc(db, coll, id));
            }
        };

        // --- DELETE ALL LOGS FUNCTION ---
        window.deleteAllLogs = async () => {
            const confirm1 = confirm("⚠️ ATTENTION: You are about to wipe ALL attendance records.");
            if (confirm1) {
                const confirm2 = confirm("Are you ABSOLUTELY sure? This cannot be undone.");
                if (confirm2) {
                    try {
                        const q = query(collection(db, "attendance"));
                        const snapshot = await getDocs(q);
                        
                        // Use a batch to delete up to 500 docs at once (efficient)
                        const batch = writeBatch(db);
                        snapshot.forEach((d) => {
                            batch.delete(d.ref);
                        });
                        
                        await batch.commit();
                        alert("Attendance logs cleared successfully.");
                    } catch (e) {
                        alert("Error clearing logs: " + e.message);
                    }
                }
            }
        };
    </script>
</body>
</html>
